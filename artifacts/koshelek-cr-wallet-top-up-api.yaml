                    traceId: 0af7651916cd43dd8448eb211c8032a9
                coreBankingUnavailable:
                  summary: АБС недоступна (AC-16)
                  value:
                    type: https://api.bank.example/problems/core-banking-unavailable
                    title: Core banking unavailable
                    status: 503
                    code: CORE_BANKING_UNAVAILABLE
                    traceId: 0af7651916cd43dd8448eb211c8032aa
                platformUnavailable:
                  summary: Платформа недоступна (AC-16)
                  value:
                    type: https://api.bank.example/problems/platform-unavailable
                    title: Platform unavailable
                    status: 503
                    code: PLATFORM_UNAVAILABLE
                    traceId: 0af7651916cd43dd8448eb211c8032ab
        '504':
          description: |
            Внешняя система не ответила при проверках (INT-DRP-02, 04, 05, INT-ABS-02,
            INT-AF-02), повторы исчерпаны — `UPSTREAM_TIMEOUT`; операция не создаётся (AC-16, E1).
            Запрос можно повторить с тем же `Idempotency-Key` (BR-IDM-03).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.bank.example/problems/upstream-timeout
                title: Upstream timeout
                status: 504
                code: UPSTREAM_TIMEOUT
                traceId: 0af7651916cd43dd8448eb211c8032ac

  /wallets/{walletId}/top-ups/{topUpId}:
    get:
      operationId: getWalletTopUp
      summary: Получить операцию пополнения и её статус
      description: |
        Шаги 8–9 сценария SCRUM-2195: приложение опрашивает статус до финального; после
        зачисления операция содержит баланс кошелька (AC-06, FR-TOP-07).

        **Опрос:** рекомендуемый интервал — 2 с, максимальное время ожидания на клиенте — 60 с,
        после чего приложение показывает «операция в обработке» (NFR-PERF-03). Не чаще 1 раза
        в секунду на операцию, иначе `429` (NFR-RATE-03).

        **Переходы, которые сервер выполняет без вызова клиента** (статусная модель §8.4,
        BR-DR-TOP-06; асинхронные шаги модуль доделывает в окне `W` = 10 мин):
        - `CHECKING` → `FUNDS_HELD` → `PLATFORM_PROCESSING` — сумма заблокирована (INT-ABS-03,
          идемпотентна по id операции, повтор `RP-EXP`), зачисление отправлено (INT-DRP-06);
        - `CHECKING` → `REJECTED` — АБС отказала в блокировке: `rejectReason` =
          `INSUFFICIENT_FUNDS`, `ACCOUNT_RESTRICTED`, `ACCOUNT_CLOSED` (AC-08, AC-10);
        - `CHECKING` → `FAILED` — АБС недоступна дольше окна `W`, `errorCode =
          CORE_BANKING_UNAVAILABLE` (AC-16);
        - `ON_REVIEW` → `CHECKING` — проверка пройдена (INT-AF-03), далее как выше;
        - `ON_REVIEW` → `REJECTED` — `rejectReason = OPERATION_DECLINED_BY_SECURITY` (AC-14);
        - `PLATFORM_PROCESSING` → `COMPLETED` — платформа зачислила средства; в операции
          `walletBalanceAfter`, `balanceAsOf`, `completedAt` (AC-06). Списание блокировки
          (INT-ABS-04) — внутренний шаг банка, на статус не влияет;
        - `PLATFORM_PROCESSING` → `RELEASING_HOLD` → `FAILED` — платформа отказала
          (`errorCode` = `TOP_UP_MONTHLY_LIMIT_EXCEEDED`, `WALLET_RESTRICTED`,
          `WALLET_CREDIT_REFUSED`; AC-15, BR-DR-TOP-07) или не получила зачисление за окно `W`
          (`PLATFORM_UNAVAILABLE`). `FAILED` наступает после снятия блокировки (INT-ABS-05);
          пока блокировка не снята, операция в `RELEASING_HOLD` (BR-ACC-07);
        - результат не получен за 30 с — операция остаётся в `PLATFORM_PROCESSING`, модуль
          уточняет статус на платформе (INT-DRP-08) и без уточнения зачисление повторно не
          отправляет (AC-17, E2, NFR-AV-03).

        Чужая или несуществующая операция — `404` (AC-18, BR-GEN-02). Внешние системы
        в запросе не вызываются. Критерии приёмки: AC-06, AC-14, AC-15, AC-17, AC-18.
      tags: [Wallet Top-up]
      x-jira-key: SCRUM-2195
      x-acceptance-criteria: [AC-06, AC-14, AC-15, AC-17, AC-18]
      x-business-rules: [BR-GEN-02, BR-ACC-07, BR-AF-02, BR-AF-03, BR-DR-TOP-06, BR-DR-OPS-03, BR-TIME-03]
      parameters:
        - $ref: '#/components/parameters/WalletId'
        - $ref: '#/components/parameters/TopUpId'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Операция пополнения с текущим статусом. Содержит банковскую тайну — не кэшируется.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUp'
              examples:
                checking:
                  summary: Блокируется сумма на счёте
                  value:
                    topUpId: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
                    walletId: 9c8b7a6d-5e4f-4321-8765-0fedcba98765
                    sourceAccountId: 5b4a3c2d-1e0f-4a9b-8c7d-6e5f4a3b2c1d
                    amount:
                      value: '15000.00'
                      currency: RUB
                    fee:
                      value: '0.00'
                      currency: RUB
                    status: CHECKING
                    createdAt: '2026-11-25T14:30:00+03:00'
                processing:
                  summary: Зачисление на платформе, в том числе после таймаута (AC-17)
                  value:
                    topUpId: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
                    walletId: 9c8b7a6d-5e4f-4321-8765-0fedcba98765
                    sourceAccountId: 5b4a3c2d-1e0f-4a9b-8c7d-6e5f4a3b2c1d
                    amount:
                      value: '15000.00'
                      currency: RUB
                    fee:
                      value: '0.00'
                      currency: RUB
                    status: PLATFORM_PROCESSING
                    createdAt: '2026-11-25T14:30:00+03:00'
                completed:
                  summary: Средства зачислены (AC-06)
                  value:
                    topUpId: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
                    walletId: 9c8b7a6d-5e4f-4321-8765-0fedcba98765
                    sourceAccountId: 5b4a3c2d-1e0f-4a9b-8c7d-6e5f4a3b2c1d
                    amount:
                      value: '15000.00'
                      currency: RUB
                    fee:
                      value: '0.00'
                      currency: RUB
                    status: COMPLETED
                    walletBalanceAfter:
                      value: '15000.00'
                      currency: RUB
                    balanceAsOf: '2026-11-25T14:30:03+03:00'
                    createdAt: '2026-11-25T14:30:00+03:00'
                    completedAt: '2026-11-25T14:30:03+03:00'
                failed:
                  summary: Платформа отказала, блокировка снята (AC-15)
                  value:
                    topUpId: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
                    walletId: 9c8b7a6d-5e4f-4321-8765-0fedcba98765
                    sourceAccountId: 5b4a3c2d-1e0f-4a9b-8c7d-6e5f4a3b2c1d
                    amount:
                      value: '15000.00'
                      currency: RUB
                    fee:
                      value: '0.00'
                      currency: RUB
                    status: FAILED
                    errorCode: WALLET_RESTRICTED
                    createdAt: '2026-11-25T14:30:00+03:00'
                    completedAt: '2026-11-25T14:30:04+03:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Статус запрашивается чаще 1 раза в секунду — `TOO_MANY_REQUESTS` (NFR-RATE-03).
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.bank.example/problems/too-many-requests
                title: Too many requests
                status: 429
                code: TOO_MANY_REQUESTS
                traceId: 0af7651916cd43dd8448eb211c8032b0
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Токен доступа (JWT), выпущенный сервером авторизации банка; клиент определяется по токену (BR-GEN-01).
  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Сквозной идентификатор запроса для трассировки (NFR-OBS-01).
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Ключ идемпотентности (UUID, без ПДн). Повтор с тем же ключом в течение 24 часов
        возвращает исходный итоговый ответ и не выполняет действие повторно (BR-IDM-01,
        NFR-AV-04). Повтор с тем же ключом и другим телом — `422 IDEMPOTENCY_KEY_REUSED`
        (BR-IDM-02). Сохраняются только итоговые ответы (2xx, 4xx); ответы 5xx не сохраняются —
        повтор выполняет запрос заново, включая проверку антифрода (BR-IDM-03).
      schema:
        type: string
        format: uuid
    WalletId:
      name: walletId
      in: path
      required: true
      description: Идентификатор кошелька клиента (из `listWallets`).
      schema:
        type: string
        format: uuid
    TopUpId:
      name: topUpId
      in: path
      required: true
      description: Идентификатор операции пополнения (из ответа `createWalletTopUp`).
      schema:
        type: string
        format: uuid
  headers:
    CacheControlNoStore:
      description: Ответ содержит конфиденциальные данные и не кэшируется (SD-API-10).
      schema:
        type: string
        enum: [no-store]
    Location:
      description: URL ресурса операции пополнения.
      schema:
        type: string
        format: uri
    RetryAfter:
      description: Через сколько секунд можно повторить запрос.
      schema:
        type: integer
        minimum: 1
    XRequestId:
      description: Идентификатор запроса из `X-Request-Id` или сгенерированный сервером (NFR-OBS-01).
      schema:
        type: string
        format: uuid
  schemas:
    OwnerType:
      type: string
      description: |
        Тип кошелька: `INDIVIDUAL` — личный кошелёк физического лица; `SOLE_PROPRIETOR` —
        кошелёк ИП для предпринимательской деятельности (FR-GEN-04). Определяет допустимые
        счета-источники и наличие лимита пополнения.
      enum: [INDIVIDUAL, SOLE_PROPRIETOR]
    WalletStatus:
      type: string
      description: |
        Статус кошелька (business-rules §8.2): `ACTIVE` — действует, пополнение возможно;
        `BLOCKED_BY_CLIENT` — заблокирован клиентом, пополнение невозможно; `RESTRICTED` —
        действуют ограничения, пополнение возможно, если нет запрета на зачисление;
        `CLOSING` — закрывается, пополнение невозможно. Закрытый кошелёк (`CLOSED`) в клиентском
        API считается несуществующим и не возвращается (§8.2).
      enum: [ACTIVE, BLOCKED_BY_CLIENT, RESTRICTED, CLOSING]
    WalletSummary:
      type: object
      description: Кошелёк для выбора получателя пополнения (AC-01, FR-TOP-09). Без баланса (SD-API-01).
      required: [walletId, ownerType, status, walletNumberMasked]
      properties:
        walletId:
          type: string
          format: uuid
          readOnly: true
          description: Идентификатор кошелька; используется в путях операций пополнения.
        ownerType:
          $ref: '#/components/schemas/OwnerType'
        status:
          $ref: '#/components/schemas/WalletStatus'
        walletNumberMasked:
          type: string
          readOnly: true
          pattern: '^0x\*{4}[a-fA-F0-9]{4}$'
          description: Номер счёта цифрового рубля в маске `MASK-WALLET` — префикс `0x`, `****` и последние 4 символа (OAS-TYPE-13).
          x-sensitivity: { level: C2, category: BANK_SECRECY, masking: MASK-WALLET, log: MASK-WALLET }
    WalletList:
      type: object
      description: Кошельки клиента; не больше двух (BR-DR-OPEN-04, BR-DR-OPEN-05), поэтому без пагинации.
      required: [items]
      properties:
        items:
          type: array
          maxItems: 2
          description: Кошельки клиента; пустой массив, если кошельков нет.
          items:
            $ref: '#/components/schemas/WalletSummary'
    SourceAccount:
      type: object
      description: Счёт клиента, с которого можно пополнить выбранный кошелёк (AC-02, FR-TOP-01).
      required: [accountId, accountNumberMasked, accountType, availableBalance, debitAllowed]
      properties:
        accountId:
          type: string
          format: uuid
          readOnly: true
          description: Непрозрачный идентификатор счёта; передаётся в `sourceAccountId` при создании пополнения (SD-API-03).
        accountNumberMasked:
          type: string
          readOnly: true
          pattern: '^\*{4} \d{4}$'
          description: Номер счёта в маске `MASK-ACCOUNT` — последние 4 цифры.
          x-sensitivity: { level: C2, category: BANK_SECRECY, masking: MASK-ACCOUNT, log: MASK-ACCOUNT }
        accountType:
          type: string
          readOnly: true
          description: |
            Тип счёта: `CURRENT` — текущий счёт физического лица (для личного кошелька);
            `SETTLEMENT` — расчётный счёт ИП (для кошелька ИП) (AC-02, BR-ACC-05).
          enum: [CURRENT, SETTLEMENT]
          x-assumption: A-06 — значения enum типа счёта заданы модулем; соответствие типам счетов АБС задаёт адаптер АБС.
        availableBalance:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Доступный остаток — остаток за вычетом блокировок (BR-ACC-06).
          x-sensitivity: { level: C2, category: BANK_SECRECY, masking: MASK-NONE, log: MASK-HIDE }
        debitAllowed:
          type: boolean
          readOnly: true
          description: |
            Можно ли списать средства со счёта. `false` — по счёту действует ограничение на
            расходные операции, пополнить с него нельзя (BR-ACC-03, FR-TOP-01). Основание
            ограничения не передаётся (SD-API-15).
    SourceAccountList:
      type: object
      description: Счета для пополнения выбранного кошелька.
      required: [items]
      properties:
        items:
          type: array
          description: Счета подходящего типа, включая счета с `debitAllowed = false`; пустой массив, если подходящих счетов нет.
          items:
            $ref: '#/components/schemas/SourceAccount'
    TopUpLimit:
      type: object
      description: |
        Лимит пополнения кошелька (BR-DR-TOP-02…04). Для личного кошелька — лимит, использовано
        и остаток за скользящие 30 дней по данным платформы; для кошелька ИП — только
        `limited = false`.
      required: [walletId, limited]
      properties:
        walletId:
          type: string
          format: uuid
          description: Идентификатор кошелька.
        limited:
          type: boolean
          description: Установлен ли лимит пополнения; `true` — личный кошелёк (AC-03), `false` — кошелёк ИП (AC-04).
        windowDays:
          type: integer
          enum: [30]
          description: Период лимита в днях — скользящие 30 дней до момента запроса (BR-DR-TOP-04). Только при `limited = true`.
        limitAmount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Лимит за период — 300 000,00 ₽ (BR-DR-TOP-02). Только при `limited = true`.
        usedAmount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Сумма пополнений за период, включая операции в обработке (§8.4). Только при `limited = true`.
          x-sensitivity: { level: C2, category: BANK_SECRECY, masking: MASK-NONE, log: MASK-HIDE }
        remainingAmount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Остаток лимита за период. Только при `limited = true`.
          x-sensitivity: { level: C2, category: BANK_SECRECY, masking: MASK-NONE, log: MASK-HIDE }
    CreateWalletTopUpRequest:
      type: object
      additionalProperties: false
      description: Распоряжение о пополнении кошелька, подписанное ключом ЭП клиента (FR-TOP-02, FR-GEN-07).
      required: [sourceAccountId, amount, signature]
      properties:
        sourceAccountId:
          type: string
          format: uuid
          description: Идентификатор счёта-источника клиента (из `listTopUpSourceAccounts`, BR-DR-TOP-01).
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Сумма пополнения в рублях; больше нуля, не более двух знаков после запятой (BR-AMT-01, BR-AMT-02). Цифровой рубль равен безналичному 1:1, курса нет (BR-AMT-03).
          x-sensitivity: { level: C2, category: BANK_SECRECY, masking: MASK-NONE, log: MASK-HIDE }
        signature:
          type: string
          format: byte
          writeOnly: true
          description: |
            Подпись распоряжения ключом ЭП клиента, сформированная на устройстве (BR-CNF-04):
            отсоединённая CMS по ГОСТ Р 34.10-2012 в Base64. Подписываются данные в каноническом
            JSON (RFC 8785): `walletId` из пути, `sourceAccountId`, `amount.value`,
            `amount.currency` и значение заголовка `Idempotency-Key`. Модуль проверяет подпись
            по сертификату клиента и передаёт её на платформу без изменений (NFR-SEC-05).
          x-sensitivity: { level: C1, log: MASK-HASH }
    TopUpStatus:
      type: string
      description: |
        Статус операции пополнения (business-rules §8.4): `CREATED` — создана; `CHECKING` —
        проверки до ответа пройдены, блокируется сумма на счёте; `ON_REVIEW` — дополнительная
        проверка; `FUNDS_HELD` — сумма заблокирована; `PLATFORM_PROCESSING` — зачисление на
        платформе, в том числе уточнение статуса после таймаута; `RELEASING_HOLD` — зачисление
        не выполнено, снимается блокировка; `COMPLETED` — зачислено на платформе;
        `REJECTED` — отказ до зачисления (см. `rejectReason`); `FAILED` — зачисление не
        выполнено, блокировки нет (см. `errorCode`).
        Финальные: `COMPLETED`, `REJECTED`, `FAILED`. `AWAITING_CONFIRMATION`, `EXPIRED`,
        `CANCELLED` не используются: подтверждение отдельным шагом и отмена вне объёма
        (§8.4, FR-TOP-05).
      enum: [CREATED, CHECKING, ON_REVIEW, FUNDS_HELD, PLATFORM_PROCESSING, RELEASING_HOLD, COMPLETED, REJECTED, FAILED]
    TopUp:
      type: object
      description: Операция пополнения кошелька. Деталей проверки антифрода не содержит (BR-AF-03, SD-API-15).
      required: [topUpId, walletId, sourceAccountId, amount, fee, status, createdAt]
      properties:
        topUpId:
          type: string
          format: uuid
          readOnly: true
          description: Идентификатор операции пополнения.
        walletId:
          type: string
          format: uuid
          readOnly: true
          description: Кошелёк-получатель.
        sourceAccountId:
          type: string
          format: uuid
          readOnly: true
          description: Счёт-источник.
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Сумма пополнения.
          x-sensitivity: { level: C2, category: BANK_SECRECY, masking: MASK-NONE, log: MASK-HIDE }
        fee:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Комиссия; пополнение бесплатно — всегда 0.00 RUB (BR-DR-TOP-05, FR-TOP-08).
        status:
          $ref: '#/components/schemas/TopUpStatus'
        rejectReason:
          type: string
          readOnly: true
          description: |
            Причина отказа; только в статусе `REJECTED`.
            `OPERATION_DECLINED_BY_SECURITY` — отклонено проверкой безопасности, без деталей
            (AC-14, BR-AF-03); `INSUFFICIENT_FUNDS`, `ACCOUNT_RESTRICTED`, `ACCOUNT_CLOSED` —
            АБС отказала в блокировке суммы (§8.4, таблица соответствия ошибок АБС).
          enum: [OPERATION_DECLINED_BY_SECURITY, INSUFFICIENT_FUNDS, ACCOUNT_RESTRICTED, ACCOUNT_CLOSED]
        errorCode:
          type: string
          readOnly: true
          description: |
            Причина неуспешного пополнения; только в статусе `FAILED` (AC-15, §8.4).
            `TOP_UP_MONTHLY_LIMIT_EXCEEDED`, `WALLET_RESTRICTED` — платформа отказала в
            зачислении (таблица соответствия ошибок платформы); `WALLET_CREDIT_REFUSED` —
            платформа отказала по другой причине, детали не раскрываются (BR-DR-TOP-07);
            `PLATFORM_UNAVAILABLE` — платформа не получила зачисление за окно повторных отправок;
            `CORE_BANKING_UNAVAILABLE` — АБС недоступна дольше окна, сумма не заблокирована.
          enum: [TOP_UP_MONTHLY_LIMIT_EXCEEDED, WALLET_RESTRICTED, WALLET_CREDIT_REFUSED, PLATFORM_UNAVAILABLE, CORE_BANKING_UNAVAILABLE]
        walletBalanceAfter:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Баланс кошелька после зачисления по данным платформы (AC-06, BR-DR-OPS-03); только в статусе `COMPLETED`.
          x-sensitivity: { level: C2, category: BANK_SECRECY, masking: MASK-NONE, log: MASK-HIDE }
        balanceAsOf:
          type: string
          format: date-time
          readOnly: true
          description: Момент, на который платформа сообщила баланс (BR-DR-OPS-03); только в статусе `COMPLETED`.
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Дата и время создания операции.
        completedAt:
          type: string
          format: date-time
          readOnly: true
          description: Дата и время перехода в финальный статус; только в `COMPLETED`, `REJECTED`, `FAILED`.
    Money:
      type: object
      description: Денежная сумма (OAS-TYPE-04).
      required: [value, currency]
      properties:
        value:
          type: string
          pattern: '^\d{1,15}(\.\d{1,2})?$'
          description: Сумма в рублях с точностью до копеек.
        currency:
          type: string
          enum: [RUB]
          description: Код валюты по ISO 4217.
    Problem:
      type: object
      description: Ошибка в формате RFC 9457 (OAS-ERR-02).
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: URI типа ошибки.
        title:
          type: string
          description: Краткое техническое описание типа ошибки; текст для клиента формирует приложение по `code` (NFR-CMP-03).
        status:
          type: integer
          description: HTTP-код ответа.
        detail:
          type: string
          description: Пояснение без ПДн, значений полей запроса и сведений о мерах ПОД/ФТ (SD-API-07).
        instance:
          type: string
          description: Идентификатор конкретного случая ошибки.
        code:
          type: string
          description: Бизнес-код ошибки из каталога business-rules §9.
        traceId:
          type: string
          description: Идентификатор для поиска в журналах (NFR-OBS-02).
        errors:
          type: array
          description: Ошибки валидации полей (только для 400).
          items:
            type: object
            required: [field, code]
            properties:
              field:
                type: string
                description: Путь к полю в запросе.
              code:
                type: string
                description: Код ошибки валидации.
              message:
                type: string
                description: Пояснение.
    TopUpProblem:
      description: Ошибка создания пополнения с остатком лимита, которого требует AC-09.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            remainingAmount:
              allOf:
                - $ref: '#/components/schemas/Money'
              description: Остаток лимита пополнения за скользящие 30 дней; только при `TOP_UP_MONTHLY_LIMIT_EXCEEDED` (AC-09, BR-DR-TOP-02).
              x-sensitivity: { level: C2, category: BANK_SECRECY, masking: MASK-NONE, log: MASK-HIDE }
  examples:
    IdempotencyKeyReused:
      summary: Ключ идемпотентности использован с другим телом (BR-IDM-02)
      value:
        type: https://api.bank.example/problems/idempotency-key-reused
        title: Idempotency key reused
        status: 422
        code: IDEMPOTENCY_KEY_REUSED
        traceId: 0af7651916cd43dd8448eb211c8032b1
  responses:
    BadRequest:
      description: Некорректный запрос — `VALIDATION_ERROR`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.bank.example/problems/validation-error
            title: Validation error
            status: 400
            code: VALIDATION_ERROR
            traceId: 0af7651916cd43dd8448eb211c8032b2
            errors:
              - field: walletId
                code: INVALID_FORMAT
                message: Ожидается UUID.
    Unauthorized:
      description: Требуется аутентификация — `UNAUTHORIZED` (BR-GEN-01).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.bank.example/problems/unauthorized
            title: Unauthorized
            status: 401
            code: UNAUTHORIZED
            traceId: 0af7651916cd43dd8448eb211c8032b3
    NotFound:
      description: Ресурс не найден или принадлежит другому клиенту — `RESOURCE_NOT_FOUND` (AC-18, BR-GEN-02, OAS-ERR-07).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.bank.example/problems/resource-not-found
            title: Resource not found
            status: 404
            code: RESOURCE_NOT_FOUND
            traceId: 0af7651916cd43dd8448eb211c8032b4
    InternalServerError:
      description: Внутренняя ошибка сервера — `INTERNAL_ERROR`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.bank.example/problems/internal-error
            title: Internal error
            status: 500
            code: INTERNAL_ERROR
            traceId: 0af7651916cd43dd8448eb211c8032b5
    PlatformUnavailable:
      description: |
        Платформа цифрового рубля недоступна, повторы `RP-EXP` исчерпаны — `PLATFORM_UNAVAILABLE`.
        Повторить позже (AC-16, E1).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.bank.example/problems/platform-unavailable
            title: Platform unavailable
            status: 503
            code: PLATFORM_UNAVAILABLE
            traceId: 0af7651916cd43dd8448eb211c8032b6
    CoreBankingUnavailable:
      description: |
        АБС недоступна, повторы `RP-EXP` исчерпаны — `CORE_BANKING_UNAVAILABLE`.
        Повторить позже (AC-16, E1).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.bank.example/problems/core-banking-unavailable
            title: Core banking unavailable
            status: 503
            code: CORE_BANKING_UNAVAILABLE
            traceId: 0af7651916cd43dd8448eb211c8032b7
    GatewayTimeout:
      description: |
        Внешняя система не ответила за отведённое время, повторы исчерпаны — `UPSTREAM_TIMEOUT`.
        Повторить позже (AC-16, E1).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.bank.example/problems/upstream-timeout
            title: Upstream timeout
            status: 504
            code: UPSTREAM_TIMEOUT
            traceId: 0af7651916cd43dd8448eb211c8032b8
