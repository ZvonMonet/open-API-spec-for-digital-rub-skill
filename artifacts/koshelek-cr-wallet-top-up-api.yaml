        '409':
          description: |
            `CONTRACT_REACCEPTANCE_REQUIRED` — Банк России изменил договор, клиент не принял
            новую версию; операции по кошельку заблокированы до принятия (AC-19, BR-DR-OPEN-09).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.bank.example/problems/contract-reacceptance-required
                title: Contract reacceptance required
                status: 409
                code: CONTRACT_REACCEPTANCE_REQUIRED
                traceId: 0af7651916cd43dd8448eb211c8032a3
        '422':
          description: |
            Нарушено бизнес-правило, операция не создаётся:
            - `ACCOUNT_CLOSED`, `ACCOUNT_RESTRICTED`, `ACCOUNT_CURRENCY_NOT_SUPPORTED`,
              `ACCOUNT_TYPE_NOT_SUPPORTED` — счёт не подходит (AC-10, BR-ACC-02…05);
            - `INSUFFICIENT_FUNDS` — недостаточно средств на счёте (AC-08, BR-ACC-06);
            - `TOP_UP_MONTHLY_LIMIT_EXCEEDED` — сумма больше остатка лимита личного кошелька;
              в `remainingAmount` — остаток (AC-09, BR-DR-TOP-02);
            - `WALLET_BLOCKED`, `WALLET_RESTRICTED` — кошелёк недоступен для зачисления
              (AC-12, §8.2);
            - `SIGNATURE_INVALID` — подпись распоряжения не прошла проверку (BR-CNF-04);
            - `IDEMPOTENCY_KEY_REUSED` — ключ уже использован с другим телом (BR-IDM-02).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TopUpProblem'
              examples:
                insufficientFunds:
                  summary: Недостаточно средств (AC-08)
                  value:
                    type: https://api.bank.example/problems/insufficient-funds
                    title: Insufficient funds
                    status: 422
                    code: INSUFFICIENT_FUNDS
                    traceId: 0af7651916cd43dd8448eb211c8032a4
                limitExceeded:
                  summary: Превышен лимит за 30 дней (AC-09)
                  value:
                    type: https://api.bank.example/problems/top-up-monthly-limit-exceeded
                    title: Top-up limit exceeded
                    status: 422
                    code: TOP_UP_MONTHLY_LIMIT_EXCEEDED
                    remainingAmount:
                      value: '10000.00'
                      currency: RUB
                    traceId: 0af7651916cd43dd8448eb211c8032a5
                accountTypeNotSupported:
                  summary: Личный счёт для кошелька ИП (AC-10)
                  value:
                    type: https://api.bank.example/problems/account-type-not-supported
                    title: Account type not supported
                    status: 422
                    code: ACCOUNT_TYPE_NOT_SUPPORTED
                    traceId: 0af7651916cd43dd8448eb211c8032a6
                walletBlocked:
                  summary: Кошелёк заблокирован клиентом (AC-12)
                  value:
                    type: https://api.bank.example/problems/wallet-blocked
                    title: Wallet blocked
                    status: 422
                    code: WALLET_BLOCKED
                    traceId: 0af7651916cd43dd8448eb211c8032a7
                signatureInvalid:
                  summary: Подпись не прошла проверку (BR-CNF-04)
                  value:
                    type: https://api.bank.example/problems/signature-invalid
                    title: Signature invalid
                    status: 422
                    code: SIGNATURE_INVALID
                    traceId: 0af7651916cd43dd8448eb211c8032ad
                idempotencyKeyReused:
                  $ref: '#/components/examples/IdempotencyKeyReused'
        '429':
          description: |
            Клиент уже создал операцию пополнения за последнюю минуту — `TOO_MANY_REQUESTS`;
            в `Retry-After` — через сколько секунд можно повторить (AC-21, NFR-RATE-02).
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.bank.example/problems/too-many-requests
                title: Too many requests
                status: 429
                code: TOO_MANY_REQUESTS
                traceId: 0af7651916cd43dd8448eb211c8032a8
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: |
            Внешняя система недоступна, повторы исчерпаны; операция не создаётся, средства не
            блокируются (AC-16, AC-20, E1, E3):
            - `CORE_BANKING_UNAVAILABLE` — АБС (INT-ABS-02);
            - `PLATFORM_UNAVAILABLE` — платформа (INT-DRP-02, 04, 05);
            - `SERVICE_UNAVAILABLE` — проверка безопасности; система клиенту не называется
              (INT-AF-02, BR-AF-06).

            Повторить можно с тем же `Idempotency-Key`: ответ 5xx не сохранён, запрос
            выполняется заново, включая проверку антифрода (BR-IDM-03).
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                serviceUnavailable:
                  summary: Проверка безопасности недоступна (AC-20)
