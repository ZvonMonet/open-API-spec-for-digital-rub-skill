                status: 400
                code: VALIDATION_ERROR
                traceId: 0af7651916cd43dd8448eb211c8032a0
                errors:
                  - field: amount.value
                    code: INVALID_AMOUNT
                    message: Сумма должна быть больше нуля, не более двух знаков после запятой.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            - `ACCOUNT_NOT_OWNED` — счёт не принадлежит клиенту (AC-10, BR-ACC-01);
            - `CERTIFICATE_INVALID` — сертификат ключа проверки ЭП недействителен (AC-13, §8.7).
          content:
            application/problem+json:
              schema:
