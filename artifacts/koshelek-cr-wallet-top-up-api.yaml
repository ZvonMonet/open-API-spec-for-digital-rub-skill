openapi: 3.0.3
info:
  title: КошелёкЦР — пополнение кошелька цифрового рубля с банковского счёта
  version: 1.1.0
  description: |
    Клиентский API модуля КошелёкЦР для пополнения кошелька (счёта) цифрового рубля
    с рублёвого счёта клиента в банке из мобильного приложения банка.

    **Потребитель:** мобильное приложение банка (через API Gateway банка, NFR-SEC-01).
    **Провайдер:** модуль КошелёкЦР.

    **Объём (SCRUM-2195, SCRUM-2197):** пополнение личного кошелька (`INDIVIDUAL`) с текущего
    рублёвого счёта физического лица и кошелька ИП (`SOLE_PROPRIETOR`) с расчётного рублёвого
    счёта ИП; выбор кошелька-получателя и счёта-источника; остаток лимита пополнения за
    скользящие 30 дней для личного кошелька; отслеживание статуса операции и баланс кошелька
    после зачисления.

    **Не входит:** вывод средств, переводы другим людям, история операций, подтверждение кодом
    OTP, API бэк-офиса; служебные обработчики результата зачисления и решения ручной проверки.

    **Внешние системы** (вызывает модуль, в клиентском API не описываются как операции):
    АБС (`CORE_BANKING`), платформа цифрового рубля Банка России (`DR_PLATFORM`), антифрод
    банка (`ANTIFRAUD`). Взаимодействие с платформой — по требованиям Банка России к участникам
    платформы: защищённый канал, СКЗИ, ГОСТ (NFR-SEC-03, SD-API-14). Вызовы внешних систем
    модуль повторяет по политике `RP-EXP`: 3 попытки, экспоненциальная задержка с полным
    джиттером (NFR-AV-05). Блокировка, списание и снятие блокировки в АБС идемпотентны по id
    операции и id блокировки и тоже повторяются; асинхронные шаги модуль доделывает в окне
    `W` = 10 мин. Отправку зачисления на платформу модуль без уточнения статуса не повторяет
    (NFR-AV-03).

    **Общее:** синхронные операции — не дольше 2 с (p95, NFR-PERF-01). Создание пополнения
    отвечает `202` после антифрода, проверки до него идут параллельно; таймаут API Gateway
    и клиента для этой операции — 10 с (NFR-PERF-06). Результат приложение узнаёт опросом
    каждые 2 с (NFR-PERF-02, NFR-PERF-03). Закрытый кошелёк в API считается несуществующим
    (404, business-rules §8.2).
    Каждый `POST` передаётся с обязательным `Idempotency-Key` (BR-IDM-01, NFR-AV-04).
    Распоряжение подписывается ключом ЭП клиента на устройстве, модуль проверяет подпись;
    отдельный OTP не нужен (FR-TOP-05, BR-CNF-04). Пароль к кошельку в API не передаётся (FR-GEN-06). Пополнение бесплатно
    (BR-DR-TOP-05).

    **Допущения** (`x-assumption` у элементов, подробности —
    `koshelek-cr-wallet-top-up-api-check.md`, раздел 7): A-03, A-06. Остальные сняты
    решениями владельца продукта 25.11.2026.
  x-jira-keys: [SCRUM-2195, SCRUM-2197]
servers:
  - url: https://api.bank.example/koshelek-cr/v1
    description: Пример окружения
security:
  - bearerAuth: []
tags:
  - name: Wallet Top-up
    description: Пополнение кошелька цифрового рубля с банковского счёта
paths:
  /wallets:
    get:
      operationId: listWallets
      summary: Получить кошельки клиента для выбора получателя пополнения
      description: |
        Шаг 2 сценария SCRUM-2195. Клиент определяется по токену (BR-GEN-01); возвращаются
        только его кошельки (BR-GEN-02). У клиента не больше двух кошельков: личный и кошелёк ИП
        (BR-DR-OPEN-04, BR-DR-OPEN-05), поэтому список без пагинации.

        **Что делает сервер (синхронно):** для каждого кошелька клиента получает текущий статус
        на платформе — INT-DRP-04 (таймаут попытки 1,5 с, повтор `RP-EXP`). Возвращает тип,
        статус и маскированный номер (AC-01, FR-TOP-09). Баланс в списке не возвращается
        (SD-API-01). Закрытые кошельки (`CLOSED`) в список не попадают (business-rules §8.2). Пополнить можно кошелёк в статусе, который допускает зачисление (§8.2);
        окончательно это проверяет `createWalletTopUp`.

        **Ошибки:** `503 PLATFORM_UNAVAILABLE` / `504 UPSTREAM_TIMEOUT` — платформа недоступна,
        повторы исчерпаны. Критерии приёмки: AC-01.
      tags: [Wallet Top-up]
      x-jira-key: SCRUM-2195
      x-acceptance-criteria: [AC-01]
      x-business-rules: [BR-GEN-01, BR-GEN-02, BR-DR-OPEN-04, BR-DR-OPEN-05, BR-TIME-03]
      x-external-systems: [DR_PLATFORM]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Кошельки клиента (AC-01). Содержит банковскую тайну — не кэшируется.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletList'
              examples:
                twoWallets:
                  summary: Личный кошелёк и кошелёк ИП
                  value:
                    items:
                      - walletId: 9c8b7a6d-5e4f-4321-8765-0fedcba98765
                        ownerType: INDIVIDUAL
                        status: ACTIVE
                        walletNumberMasked: '0x****eAed'
                      - walletId: 1d2e3f4a-5b6c-4d7e-8f90-a1b2c3d4e5f6
                        ownerType: SOLE_PROPRIETOR
                        status: ACTIVE
                        walletNumberMasked: '0x****3b9C'
                noWallets:
                  summary: У клиента нет кошельков
                  value:
                    items: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/PlatformUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /wallets/{walletId}/top-up-source-accounts:
    get:
      operationId: listTopUpSourceAccounts
      summary: Получить счета клиента, с которых можно пополнить кошелёк
      description: |
        Шаг 4 сценария SCRUM-2195. **Предусловие:** кошелёк принадлежит клиенту (BR-GEN-02).

        **Что делает сервер (синхронно):** получает счета клиента из АБС — INT-ABS-02
        (таймаут попытки 1 с, повтор `RP-EXP`) с типом владельца по типу кошелька и возвращает
        счета для пополнения этого кошелька (AC-02, FR-TOP-01):
        - клиенту принадлежат, открыты, валюта RUB (BR-ACC-01, BR-ACC-02, BR-ACC-04);
        - тип подходит к кошельку: для `INDIVIDUAL` — текущие счета физлица, для
          `SOLE_PROPRIETOR` — расчётные счета ИП (BR-ACC-05).

        Счёт с ограничениями на расходные операции возвращается с `debitAllowed = false`;
        основание ограничения не раскрывается (BR-ACC-03, SD-API-15). Приложение показывает
        такой счёт неактивным.

        Номер счёта — только в маске `MASK-ACCOUNT` (SD-API-04); доступный остаток — с учётом
        блокировок (BR-ACC-06). Подходящих счетов нет — пустой список.

        **Ошибки:** `404` — чужой, закрытый или несуществующий кошелёк; `503 CORE_BANKING_UNAVAILABLE` /
        `504 UPSTREAM_TIMEOUT` — АБС недоступна, повторы исчерпаны (AC-16, E1).
        Критерии приёмки: AC-02, AC-16.
      tags: [Wallet Top-up]
      x-jira-key: SCRUM-2195
      x-acceptance-criteria: [AC-02, AC-16]
      x-business-rules: [BR-GEN-02, BR-ACC-01, BR-ACC-02, BR-ACC-03, BR-ACC-04, BR-ACC-05, BR-ACC-06, BR-TIME-03]
      x-external-systems: [CORE_BANKING]
      parameters:
        - $ref: '#/components/parameters/WalletId'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Счета для пополнения выбранного кошелька (AC-02). Содержит банковскую тайну — не кэшируется.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceAccountList'
              examples:
                individual:
                  summary: Счета для личного кошелька
                  value:
                    items:
                      - accountId: 5b4a3c2d-1e0f-4a9b-8c7d-6e5f4a3b2c1d
                        accountNumberMasked: '**** 0001'
                        accountType: CURRENT
                        availableBalance:
                          value: '125000.00'
                          currency: RUB
                        debitAllowed: true
                      - accountId: 6c5b4a3d-2e1f-4b0a-9d8c-7f6e5d4c3b2a
                        accountNumberMasked: '**** 0003'
                        accountType: CURRENT
                        availableBalance:
                          value: '4000.00'
                          currency: RUB
                        debitAllowed: false
                soleProprietor:
                  summary: Расчётные счета для кошелька ИП
                  value:
                    items:
                      - accountId: 8e7d6c5b-4a3f-4e2d-9c1b-0a9f8e7d6c5b
                        accountNumberMasked: '**** 0002'
                        accountType: SETTLEMENT
                        availableBalance:
                          value: '980000.50'
                          currency: RUB
                        debitAllowed: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/CoreBankingUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /wallets/{walletId}/top-up-limit:
    get:
      operationId: getWalletTopUpLimit
      summary: Получить остаток лимита пополнения кошелька
      description: |
        Шаг 5 сценария SCRUM-2195. **Предусловие:** кошелёк принадлежит клиенту (BR-GEN-02).

        **Личный кошелёк (`INDIVIDUAL`):** сервер получает лимит, сумму пополнений и остаток
        у платформы — INT-DRP-05 (таймаут попытки 1,5 с, повтор `RP-EXP`). Лимит общий на
        платформе, считается за скользящие 30 дней, учитывает и сумму операций в обработке;
        модуль его не пересчитывает (AC-03, BR-DR-TOP-02, BR-DR-TOP-03, BR-DR-TOP-04, §8.4).

        **Кошелёк ИП (`SOLE_PROPRIETOR`):** лимита нет — `limited = false` без сумм (AC-04,
        BR-DR-TOP-02); платформа не вызывается (допущение A-03).

        **Ошибки:** `404` — чужой, закрытый или несуществующий кошелёк; `503 PLATFORM_UNAVAILABLE` /
        `504 UPSTREAM_TIMEOUT` — платформа недоступна, повторы исчерпаны (AC-16, E1).
        Критерии приёмки: AC-03, AC-04, AC-16.
      tags: [Wallet Top-up]
      x-jira-key: SCRUM-2195
      x-acceptance-criteria: [AC-03, AC-04, AC-16]
      x-business-rules: [BR-GEN-02, BR-DR-TOP-02, BR-DR-TOP-03, BR-DR-TOP-04, BR-TIME-03]
      x-external-systems: [DR_PLATFORM]
      x-assumption: A-03 — для кошелька ИП модуль отвечает без запроса к платформе, потому что лимит для бизнеса не установлен нормой (BR-DR-TOP-02).
      parameters:
        - $ref: '#/components/parameters/WalletId'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Лимит пополнения (AC-03, AC-04). Содержит банковскую тайну — не кэшируется.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUpLimit'
              examples:
                individual:
                  summary: Личный кошелёк — лимит 300 000 ₽ за 30 дней (AC-03)
                  value:
                    walletId: 9c8b7a6d-5e4f-4321-8765-0fedcba98765
                    limited: true
                    windowDays: 30
                    limitAmount:
                      value: '300000.00'
                      currency: RUB
                    usedAmount:
                      value: '45000.00'
                      currency: RUB
                    remainingAmount:
                      value: '255000.00'
                      currency: RUB
                soleProprietor:
                  summary: Кошелёк ИП — лимит не установлен (AC-04)
                  value:
                    walletId: 1d2e3f4a-5b6c-4d7e-8f90-a1b2c3d4e5f6
                    limited: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/PlatformUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /wallets/{walletId}/top-ups:
    post:
      operationId: createWalletTopUp
      summary: Создать операцию пополнения кошелька с банковского счёта
      description: |
        Шаг 7 сценария SCRUM-2195. Распоряжение (кошелёк, счёт, сумма, ключ идемпотентности)
        подписано ключом ЭП клиента на устройстве. Модуль проверяет подпись по сертификату
        клиента и передаёт её на платформу без изменений (BR-CNF-04, NFR-SEC-05). Отдельного
        подтверждения кодом нет (FR-TOP-05).

        **Синхронные проверки** (при отказе операция не создаётся):
        1. Не больше 1 созданной операции пополнения в минуту на клиента, иначе
           `429 TOO_MANY_REQUESTS` с `Retry-After` (AC-21, NFR-RATE-02). Запросы, на которые
           модуль ответил ошибкой, в лимит не входят.
        2. Формат: сумма больше нуля и не больше двух знаков после запятой, есть подпись —
           иначе `400 VALIDATION_ERROR` с полем в `errors[]` (AC-11, BR-AMT-01, BR-AMT-02).
        3. Кошелёк принадлежит клиенту и не закрыт — иначе `404` (BR-GEN-02, §8.2); сертификат
           ключа проверки ЭП в статусе `ISSUED` — иначе `403 CERTIFICATE_INVALID` (AC-13, §8.7);
           подпись верна для канонического JSON распоряжения — иначе `422 SIGNATURE_INVALID`
           (BR-CNF-04).
        4. Параллельно (NFR-PERF-06):
           - статус кошелька на платформе — INT-DRP-04 (1,5 с, `RP-EXP`): `BLOCKED_BY_CLIENT`
             и `CLOSING` → `422 WALLET_BLOCKED`; ограничение на зачисление →
             `422 WALLET_RESTRICTED` (AC-12, §8.2, BR-DR-RST-02…04); `CLOSED` → `404`;
           - актуальная версия договора — INT-DRP-02 (1,5 с, `RP-EXP`): клиент не принял новую
             версию → `409 CONTRACT_REACCEPTANCE_REQUIRED` (AC-19, BR-DR-OPEN-09);
           - счёт по данным АБС — INT-ABS-02 (1 с, `RP-EXP`): чужой → `403 ACCOUNT_NOT_OWNED`;
             закрыт, ограничен, не рублёвый, не подходит по типу → `422 ACCOUNT_CLOSED`,
             `ACCOUNT_RESTRICTED`, `ACCOUNT_CURRENCY_NOT_SUPPORTED`, `ACCOUNT_TYPE_NOT_SUPPORTED`
             (AC-10, BR-ACC-01…05); доступный остаток меньше суммы → `422 INSUFFICIENT_FUNDS`
             (AC-08, BR-ACC-06);
           - для `INDIVIDUAL` — остаток лимита, INT-DRP-05 (1,5 с, `RP-EXP`): сумма больше
             остатка → `422 TOP_UP_MONTHLY_LIMIT_EXCEEDED` с `remainingAmount` (AC-09,
             BR-DR-TOP-02…04). Для `SOLE_PROPRIETOR` лимит не проверяется.
        5. Антифрод — INT-AF-02 (500 мс, `RP-EXP`): повторы исчерпаны →
           `503 SERVICE_UNAVAILABLE` с `Retry-After`, операция не создаётся (AC-20, E3, BR-AF-06).

        Внешняя система недоступна на шагах 4–5, повторы исчерпаны → `503 PLATFORM_UNAVAILABLE`
        / `CORE_BANKING_UNAVAILABLE` / `SERVICE_UNAVAILABLE` или `504 UPSTREAM_TIMEOUT`;
        операция не создаётся, средства не блокируются (AC-16, E1).

        **Ответ `202`** (операция принята, AC-05; решение антифрода получено синхронно —
        OAS-ASYNC-04, BR-AF-02):
        - `ALLOW` → `CHECKING`: блокировку суммы (INT-ABS-03) и зачисление (INT-DRP-06) модуль
          выполняет после ответа, результат приложение узнаёт опросом (BR-DR-TOP-06);
        - `REVIEW` → `ON_REVIEW`, сумма не блокируется до решения проверки (AC-14, §8.4);
        - `DENY` → сразу `REJECTED`, `rejectReason = OPERATION_DECLINED_BY_SECURITY`, без
          деталей (AC-14, BR-AF-03).

        **Время ответа:** типичное — в пределах NFR-PERF-01; худший случай с повторами `RP-EXP`
        — до 10 с, таймаут API Gateway и клиента — 10 с (NFR-PERF-06).

        Повтор с тем же `Idempotency-Key` и тем же телом возвращает ту же операцию, повторной
        блокировки и зачисления нет (AC-07, A10, BR-IDM-01). Ответы 5xx по ключу не
        сохраняются: повтор выполняет запрос заново, включая антифрод (AC-20, BR-IDM-03).
        Критерии приёмки: AC-05, AC-07…AC-14, AC-16, AC-19…AC-21.
      tags: [Wallet Top-up]
      x-jira-key: SCRUM-2195
      x-acceptance-criteria: [AC-05, AC-07, AC-08, AC-09, AC-10, AC-11, AC-12, AC-13, AC-14, AC-16, AC-19, AC-20, AC-21]
      x-business-rules: [BR-GEN-01, BR-GEN-02, BR-ACC-01, BR-ACC-02, BR-ACC-03, BR-ACC-04, BR-ACC-05, BR-ACC-06, BR-ACC-07, BR-AMT-01, BR-AMT-02, BR-AMT-03, BR-CNF-01, BR-CNF-04, BR-IDM-01, BR-IDM-02, BR-IDM-03, BR-DR-TOP-01, BR-DR-TOP-02, BR-DR-TOP-03, BR-DR-TOP-04, BR-DR-TOP-05, BR-DR-TOP-06, BR-DR-OPS-01, BR-DR-OPEN-09, BR-AF-01, BR-AF-02, BR-AF-03, BR-AF-06, BR-TIME-03]
      x-external-systems: [DR_PLATFORM, CORE_BANKING, ANTIFRAUD]
      parameters:
        - $ref: '#/components/parameters/WalletId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWalletTopUpRequest'
            examples:
              topUp:
                summary: Пополнение на 15 000 ₽ со счёта клиента (AC-05)
                value:
                  sourceAccountId: 5b4a3c2d-1e0f-4a9b-8c7d-6e5f4a3b2c1d
                  amount:
                    value: '15000.00'
                    currency: RUB
                  signature: MIIBSAYJKoZIhvcNAQcCoIIBOTCCATUCAQExDDAKBggqhQMHAQECAjALBgkqhkiG9w0BBwE=
      responses:
        '202':
          description: |
            Операция принята к асинхронной обработке (`CHECKING`, AC-05), ждёт дополнительной
            проверки (`ON_REVIEW`) или сразу отклонена антифродом (`REJECTED`, AC-14). Повтор с тем
            же `Idempotency-Key` возвращает этот же ответ (AC-07).
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUp'
              examples:
                checking:
                  summary: Проверки пройдены, блокировка и зачисление — асинхронно (AC-05)
                  value:
