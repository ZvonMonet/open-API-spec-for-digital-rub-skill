        '400':
          description: |
            Некорректный запрос — `VALIDATION_ERROR`; поле — в `errors[]` (AC-11, BR-AMT-01,
            BR-AMT-02): сумма не больше нуля, больше двух знаков после запятой, нет подписи.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.bank.example/problems/validation-error
