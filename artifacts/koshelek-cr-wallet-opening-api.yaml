          description: |
            Заявка отменена, статус `CANCELLED` (AC-12). Тот же ответ возвращается при повторе
            с тем же `Idempotency-Key` (AC-20).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletApplication'
              example:
                applicationId: 3f6c1e2a-8b4d-4c21-9a7e-1d2f3a4b5c60
                ownerType: INDIVIDUAL
                status: CANCELLED
                expiresAt: '2026-11-24T10:00:00+03:00'
                createdAt: '2026-11-23T10:00:00+03:00'
                updatedAt: '2026-11-23T10:07:00+03:00'
        '400':
          $ref: '#/components/responses/BadRequest'
