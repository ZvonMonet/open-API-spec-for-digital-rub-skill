openapi: 3.0.3
info:
  title: КошелёкЦР — открытие кошелька цифрового рубля
  version: 1.0.0
  description: |
    Клиентский API модуля КошелёкЦР для открытия кошелька (счёта) цифрового рубля
    в мобильном приложении банка.

    **Потребитель:** мобильное приложение банка (через API Gateway банка).
    **Провайдер:** модуль КошелёкЦР.

    **Объём:** открытие личного кошелька физического лица (`INDIVIDUAL`) и кошелька ИП
    для предпринимательской деятельности (`SOLE_PROPRIETOR`); получение и принятие договора;
    передача запроса на сертификат ключа проверки ЭП; отслеживание статуса заявки;
    получение данных открытого кошелька.

    **Не входит:** пополнение, вывод, переводы, закрытие кошелька; API бэк-офиса;
    служебный endpoint обработки обратного вызова ЕСИА (не часть клиентского API).
    Пароль к кошельку создаётся и хранится на устройстве и в API не передаётся.
    Закрытый ключ ЭП не покидает устройство, в API передаётся только CSR.

    **Внешние системы** (вызывает модуль, клиенту не видны): АБС (`CORE_BANKING`),
    Госуслуги (`ESIA`), платформа цифрового рубля Банка России (`DR_PLATFORM`),
    антифрод банка (`ANTIFRAUD`). Взаимодействие с платформой ЦР — по требованиям
    Банка России к участникам платформы (защищённый канал, СКЗИ); в клиентском API не описывается.

    **Общее поведение:**
    - клиент определяется по токену доступа; чужая или несуществующая заявка — `404`;
    - синхронные операции — не дольше 2 с (p95);
    - шаг передачи CSR асинхронный (`202`), результат — опросом статуса заявки
      с интервалом 2 с, не дольше 60 с на клиенте;
    - незавершённая заявка истекает через 24 часа (`EXPIRED`);
    - при недоступности внешней системы возвращается `503` / `504`, статус заявки не меняется;
      запрос можно повторить (для операций с `Idempotency-Key` — с тем же ключом).

    **Задачи:** SCRUM-2194 (Task), SCRUM-2196 (Story).

    **Допущения** (подробно — в отчёте `koshelek-cr-wallet-opening-api-check.md`):
    - A-01. ИП открывает кошелёк для предпринимательской деятельности в том же приложении (из Story).
    - A-02. CSR передаётся в формате PKCS#10 DER в base64; алгоритмы ключа — ГОСТ Р 34.10-2012 (256 / 512).
    - A-03. При принятии договора модуль сверяет версию с актуальной версией на платформе ЦР.
    - A-04. При передаче CSR модуль синхронно получает сведения из АБС (для ИП), проверяет заявку
      в антифроде и передаёт запрос на платформу; результат платформы обрабатывается асинхронно.
    - A-05. Формат маскированного номера кошелька — `**** XXXX` (последние 4 символа).
  x-jira-keys: [SCRUM-2194, SCRUM-2196]
servers:
  - url: https://api.bank.example/koshelek-cr/v1
    description: Пример окружения
security:
  - bearerAuth: []
tags:
  - name: Wallet Opening
    description: Открытие кошелька цифрового рубля
paths:
  /wallet-applications:
    post:
      operationId: createWalletApplication
      summary: Создать заявку на открытие кошелька
      description: |
        Создаёт заявку на открытие кошелька выбранного типа (шаг 2 сценария SCRUM-2194).

        **Предусловия:** клиент аутентифицирован, идентифицирован в банке и не заблокирован.

        **Что делает сервер** (синхронно, по данным АБС — `CORE_BANKING`):
        - проверяет совершеннолетие и гражданство РФ (BR-DR-OPEN-01) → `422 CLIENT_NOT_ELIGIBLE`
          с `reason` `AGE` / `CITIZENSHIP` (AC-02);
        - для `SOLE_PROPRIETOR` проверяет, что клиент зарегистрирован в банке как ИП
          (BR-DR-OPEN-15) → `422 CLIENT_NOT_ELIGIBLE` с `reason: NOT_SOLE_PROPRIETOR` (AC-01b);
        - проверяет, что у клиента нет кошелька этого типа, открытого через банк
          (BR-DR-OPEN-04, 05) → `409 WALLET_ALREADY_EXISTS` с типом открытого кошелька (AC-03).
          Кошелёк другого типа открытию не мешает (AC-01a);
        - проверяет, что нет незавершённой заявки того же типа → `409 APPLICATION_IN_PROGRESS`
          с идентификатором существующей заявки (AC-04).

        Наличие счёта, открытого через другой банк, проверяется позже, после авторизации
        в Госуслугах (см. `getWalletApplication`, AC-08).

        **Результат:** заявка в статусе `CREATED` со сроком действия 24 часа (AC-01, AC-01a).

        **Идемпотентность:** повтор с тем же `Idempotency-Key` и тем же телом в течение 24 часов
        возвращает ту же заявку (AC-05); с тем же ключом и другим телом — `422 IDEMPOTENCY_KEY_REUSED`.

        **Лимит частоты:** не более 5 заявок в час на клиента → `429`.
      tags: [Wallet Opening]
      x-jira-key: SCRUM-2194
      x-acceptance-criteria: [AC-01, AC-01a, AC-01b, AC-02, AC-03, AC-04, AC-05, AC-17]
      x-business-rules: [BR-GEN-01, BR-GEN-03, BR-GEN-04, BR-DR-OPEN-01, BR-DR-OPEN-04, BR-DR-OPEN-05, BR-DR-OPEN-13, BR-DR-OPEN-15, BR-IDM-01, BR-IDM-02, BR-TIME-02]
      x-external-systems: [CORE_BANKING]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWalletApplicationRequest'
            examples:
              individual:
                summary: Личный кошелёк физического лица
                value:
                  ownerType: INDIVIDUAL
              soleProprietor:
                summary: Кошелёк ИП для предпринимательской деятельности
                value:
                  ownerType: SOLE_PROPRIETOR
      responses:
        '201':
          description: Заявка создана (или возвращена ранее созданная по тому же ключу идемпотентности).
          headers:
            Location:
              $ref: '#/components/headers/Location'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletApplication'
              examples:
                created:
                  summary: Заявка на личный кошелёк создана
                  value:
                    id: 3f6c1e2a-7b4d-4c1e-9a2b-1d2e3f4a5b6c
                    ownerType: INDIVIDUAL
                    status: CREATED
                    expiresAt: '2026-11-20T14:21:00+03:00'
                    createdAt: '2026-11-19T14:21:00+03:00'
                    updatedAt: '2026-11-19T14:21:00+03:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            Конфликт состояния. Возможные `code`:
            - `WALLET_ALREADY_EXISTS` — у клиента уже открыт через банк кошелёк этого типа; в `ownerType` — тип открытого кошелька (AC-03);
            - `APPLICATION_IN_PROGRESS` — есть незавершённая заявка того же типа; в `applicationId` — её идентификатор (AC-04).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/WalletAlreadyExistsProblem'
                  - $ref: '#/components/schemas/ApplicationInProgressProblem'
              examples:
                walletAlreadyExists:
                  summary: Кошелёк этого типа уже открыт через банк
                  value:
                    type: https://api.bank.example/problems/wallet-already-exists
                    title: Кошелёк уже открыт
                    status: 409
                    code: WALLET_ALREADY_EXISTS
                    ownerType: INDIVIDUAL
                    traceId: 0af7651916cd43dd8448eb211c80319c
                applicationInProgress:
                  summary: Есть незавершённая заявка того же типа
                  value:
                    type: https://api.bank.example/problems/application-in-progress
                    title: Заявка уже в работе
                    status: 409
                    code: APPLICATION_IN_PROGRESS
                    applicationId: 9b1d2c3e-4f5a-4b6c-8d7e-0f1a2b3c4d5e
                    traceId: 0af7651916cd43dd8448eb211c80319c
        '422':
          description: |
            Нарушено бизнес-правило. Возможные `code`:
            - `CLIENT_NOT_ELIGIBLE` — клиент не соответствует требованиям; в `reason` — `AGE`, `CITIZENSHIP` или `NOT_SOLE_PROPRIETOR` (AC-01b, AC-02);
            - `IDEMPOTENCY_KEY_REUSED` — повтор с тем же ключом идемпотентности, но с другим телом.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ClientNotEligibleProblem'
                  - $ref: '#/components/schemas/Problem'
              examples:
                notSoleProprietor:
                  summary: Запрошен кошелёк ИП, клиент не является ИП
                  value:
                    type: https://api.bank.example/problems/client-not-eligible
                    title: Клиент не соответствует требованиям
                    status: 422
                    code: CLIENT_NOT_ELIGIBLE
                    reason: NOT_SOLE_PROPRIETOR
                    traceId: 0af7651916cd43dd8448eb211c80319c
                underage:
                  summary: Клиент младше 18 лет
                  value:
                    type: https://api.bank.example/problems/client-not-eligible
                    title: Клиент не соответствует требованиям
                    status: 422
                    code: CLIENT_NOT_ELIGIBLE
                    reason: AGE
                    traceId: 0af7651916cd43dd8448eb211c80319c
                idempotencyKeyReused:
                  summary: Ключ идемпотентности использован с другим телом
                  value:
                    type: https://api.bank.example/problems/idempotency-key-reused
                    title: Ключ идемпотентности уже использован
                    status: 422
                    code: IDEMPOTENCY_KEY_REUSED
                    traceId: 0af7651916cd43dd8448eb211c80319c
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /wallet-applications/{applicationId}:
    get:
      operationId: getWalletApplication
      summary: Получить заявку на открытие кошелька
      description: |
        Возвращает текущее состояние заявки. Используется для опроса статуса (шаг 11 сценария)
        и для отслеживания переходов, которые сервер выполняет без вызова клиента:
        - `ESIA_PENDING → CONTRACT_PENDING` — данные из Госуслуг получены, на платформе нет счёта выбранного типа;
        - `ESIA_PENDING → REJECTED` с `rejectReason` `ESIA_CONSENT_DENIED` / `ESIA_ACCOUNT_NOT_CONFIRMED` (AC-07)
          или `WALLET_ALREADY_EXISTS` — счёт этого типа открыт через другой банк (AC-08);
        - `ON_REVIEW → PROCESSING` — дополнительная проверка пройдена, запрос передан на платформу ЦР;
        - `PROCESSING / ON_REVIEW → REJECTED` с `rejectReason` `OPERATION_DECLINED_BY_SECURITY`
          (общая причина без деталей проверки, AC-14), `CERTIFICATE_ISSUE_FAILED` или `WALLET_OPENING_REFUSED`;
        - `PROCESSING → COMPLETED` — кошелёк открыт, в заявке появляется `walletId` (AC-15);
        - `PROCESSING → FAILED` — техническая ошибка без возможности повтора;
        - нефинальная заявка до `PROCESSING` → `EXPIRED` по истечении `expiresAt` (24 часа, AC-19).

        Финальные статусы: `COMPLETED`, `REJECTED`, `CANCELLED`, `EXPIRED`, `FAILED`.

        **Опрос:** рекомендуемый интервал — 2 с; не чаще 1 раза в секунду (иначе `429`);
        если за 60 с статус не стал финальным, приложение показывает «заявка в обработке».

        Заявка другого клиента или несуществующая — `404` (AC-18). Внешние системы не вызываются.
      tags: [Wallet Opening]
      x-jira-key: SCRUM-2194
      x-acceptance-criteria: [AC-07, AC-08, AC-14, AC-15, AC-18, AC-19]
      x-business-rules: [BR-GEN-01, BR-GEN-02, BR-AF-02, BR-AF-03, BR-AML-01, BR-DR-OPEN-02, BR-DR-OPEN-04, BR-DR-OPEN-05, BR-DR-OPEN-10, BR-DR-OPEN-14, BR-TIME-02]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Заявка.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletApplication'
              examples:
                completed:
                  summary: Кошелёк открыт
                  value:
                    id: 3f6c1e2a-7b4d-4c1e-9a2b-1d2e3f4a5b6c
                    ownerType: INDIVIDUAL
                    status: COMPLETED
                    walletId: 6a7b8c9d-0e1f-4a2b-9c3d-4e5f6a7b8c9d
                    acceptedContractVersion: '2026.09.01'
                    contractAcceptedAt: '2026-11-19T14:25:10+03:00'
                    expiresAt: '2026-11-20T14:21:00+03:00'
                    createdAt: '2026-11-19T14:21:00+03:00'
                    updatedAt: '2026-11-19T14:27:42+03:00'
                rejectedEsia:
                  summary: Клиент отказал в согласии на Госуслугах
                  value:
                    id: 3f6c1e2a-7b4d-4c1e-9a2b-1d2e3f4a5b6c
                    ownerType: INDIVIDUAL
                    status: REJECTED
                    rejectReason: ESIA_CONSENT_DENIED
                    expiresAt: '2026-11-20T14:21:00+03:00'
                    createdAt: '2026-11-19T14:21:00+03:00'
                    updatedAt: '2026-11-19T14:23:05+03:00'
                rejectedSecurity:
                  summary: Отказ по результатам проверки безопасности
                  value:
                    id: 3f6c1e2a-7b4d-4c1e-9a2b-1d2e3f4a5b6c
                    ownerType: SOLE_PROPRIETOR
                    status: REJECTED
                    rejectReason: OPERATION_DECLINED_BY_SECURITY
                    acceptedContractVersion: '2026.09.01'
                    contractAcceptedAt: '2026-11-19T14:25:10+03:00'
                    expiresAt: '2026-11-20T14:21:00+03:00'
                    createdAt: '2026-11-19T14:21:00+03:00'
                    updatedAt: '2026-11-19T14:26:30+03:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /wallet-applications/{applicationId}/esia-authorization:
    post:
      operationId: createEsiaAuthorization
      summary: Получить ссылку для авторизации в Госуслугах
      description: |
        Формирует запрос авторизации в Госуслугах (ЕСИА) и возвращает ссылку для перехода
        клиента (шаг 3 сценария, AC-06).

        **Предусловие:** заявка в статусе `CREATED`; иначе `409 INVALID_APPLICATION_STATE`.

        **Что делает сервер:** синхронно обращается к ЕСИА (`ESIA`), переводит заявку
        в `ESIA_PENDING`. Результат авторизации ЕСИА возвращает на сервер банка (служебный endpoint,
        вне клиентского API); дальнейшие переходы клиент видит через `getWalletApplication`.
        Код авторизации, токены и данные из ЕСИА клиенту не возвращаются.

        **Недоступность ЕСИА:** `503 PLATFORM_UNAVAILABLE` / `504 UPSTREAM_TIMEOUT`,
        заявка остаётся в `CREATED`; запрос можно повторить с тем же `Idempotency-Key` (AC-17).
      tags: [Wallet Opening]
      x-jira-key: SCRUM-2194
      x-acceptance-criteria: [AC-06, AC-17, AC-18]
      x-business-rules: [BR-GEN-01, BR-GEN-02, BR-DR-OPEN-02, BR-IDM-01, BR-IDM-02, BR-TIME-03]
      x-external-systems: [ESIA]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Ссылка для авторизации сформирована, заявка в статусе `ESIA_PENDING`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsiaAuthorization'
              examples:
                esiaPending:
                  summary: Ссылка на Госуслуги
                  value:
                    applicationId: 3f6c1e2a-7b4d-4c1e-9a2b-1d2e3f4a5b6c
                    status: ESIA_PENDING
                    authorizationUrl: https://esia.example/aas/oauth2/ac?client_id=BANK_EXAMPLE&state=5d1c2b3a-4e5f-4a6b-8c7d-9e0f1a2b3c4d
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Конфликт состояния. Возможные `code`:
            - `INVALID_APPLICATION_STATE` — заявка не в статусе `CREATED` (в том числе в финальном статусе, AC-19).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalidState:
                  summary: Заявка не в статусе CREATED
                  value:
                    type: https://api.bank.example/problems/invalid-application-state
                    title: Недопустимое действие для текущего статуса заявки
                    status: 409
                    code: INVALID_APPLICATION_STATE
                    traceId: 0af7651916cd43dd8448eb211c80319c
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /wallet-applications/{applicationId}/contract:
    get:
      operationId: getWalletApplicationContract
      summary: Получить договор счёта цифрового рубля
      description: |
        Возвращает актуальную версию договора счёта цифрового рубля, ссылки на правила платформы
        и тарифы (шаг 6 сценария, AC-09). Повторный вызов после `409 CONTRACT_VERSION_OUTDATED`
        возвращает новую версию договора (A7).

        **Предусловие:** заявка в статусе `CONTRACT_PENDING`; иначе `409 INVALID_APPLICATION_STATE`.

        **Что делает сервер:** синхронно получает договор на платформе ЦР (`DR_PLATFORM`).
        Статус заявки не меняется.

        **Недоступность платформы:** `503 PLATFORM_UNAVAILABLE` / `504 UPSTREAM_TIMEOUT`;
        запрос можно повторить (операция чтения идемпотентна, AC-17).
      tags: [Wallet Opening]
      x-jira-key: SCRUM-2194
      x-acceptance-criteria: [AC-09, AC-17, AC-18]
      x-business-rules: [BR-GEN-01, BR-GEN-02, BR-DR-OPEN-08, BR-DR-OPEN-09, BR-TIME-03]
      x-external-systems: [DR_PLATFORM]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Актуальная версия договора.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletContract'
              examples:
                contract:
                  summary: Договор счёта цифрового рубля
                  value:
                    contractId: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                    contractVersion: '2026.09.01'
                    documentUrl: https://dr-platform.example/documents/contract/2026.09.01.pdf
                    platformRulesUrl: https://dr-platform.example/documents/rules/current.pdf
                    tariffsUrl: https://dr-platform.example/documents/tariffs/current.pdf
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidApplicationState'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /wallet-applications/{applicationId}/contract-acceptance:
    post:
      operationId: acceptWalletApplicationContract
      summary: Принять договор счёта цифрового рубля
      description: |
        Фиксирует согласие клиента с договором, правилами платформы и тарифами
        с указанием версии договора (шаг 8 сценария, AC-10). Счёт открывается только
        по явному волеизъявлению клиента (`accepted: true`).

        **Предусловие:** заявка в статусе `CONTRACT_PENDING`; иначе `409 INVALID_APPLICATION_STATE`.

        **Что делает сервер:** сверяет переданную версию с актуальной версией договора
        на платформе ЦР (`DR_PLATFORM`, синхронно). Если версия устарела —
        `409 CONTRACT_VERSION_OUTDATED`, приложение заново запрашивает договор (AC-11).
        Иначе сохраняет версию и время согласия и переводит заявку в `KEYS_PENDING`.

        Отказ клиента от договора (A6) — операция `cancelWalletApplication`.

        **Недоступность платформы:** `503 PLATFORM_UNAVAILABLE` / `504 UPSTREAM_TIMEOUT`,
        статус заявки не меняется (AC-17).

        **Идемпотентность:** если сервер уже перевёл заявку в `KEYS_PENDING`, а клиент не получил ответ
        (например, `504`), повтор с тем же `Idempotency-Key` возвращает тот же `200`, а не
        `409 INVALID_APPLICATION_STATE`. Тот же ключ с другим телом — `422 IDEMPOTENCY_KEY_REUSED`.
      tags: [Wallet Opening]
      x-jira-key: SCRUM-2194
      x-acceptance-criteria: [AC-10, AC-11, AC-17, AC-18]
      x-business-rules: [BR-GEN-01, BR-GEN-02, BR-DR-OPEN-07, BR-DR-OPEN-08, BR-DR-OPEN-09, BR-TIME-03, BR-IDM-01, BR-IDM-02]
      x-external-systems: [DR_PLATFORM]
      x-assumption: Актуальность версии договора проверяется запросом к платформе ЦР (integrations.md, таблица ошибок платформы); в Task шаг 8 не помечен как обращение к внешней системе.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptWalletContractRequest'
            examples:
              accept:
                summary: Клиент принимает договор
                value:
                  contractId: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                  contractVersion: '2026.09.01'
                  accepted: true
      responses:
        '200':
          description: Согласие зафиксировано, заявка в статусе `KEYS_PENDING`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletApplication'
              examples:
                keysPending:
                  summary: Договор принят
                  value:
                    id: 3f6c1e2a-7b4d-4c1e-9a2b-1d2e3f4a5b6c
                    ownerType: INDIVIDUAL
                    status: KEYS_PENDING
                    acceptedContractVersion: '2026.09.01'
                    contractAcceptedAt: '2026-11-19T14:25:10+03:00'
                    expiresAt: '2026-11-20T14:21:00+03:00'
                    createdAt: '2026-11-19T14:21:00+03:00'
                    updatedAt: '2026-11-19T14:25:10+03:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Конфликт состояния. Возможные `code`:
            - `CONTRACT_VERSION_OUTDATED` — Банк России опубликовал новую версию договора; нужно запросить договор заново (AC-11);
            - `INVALID_APPLICATION_STATE` — заявка не в статусе `CONTRACT_PENDING`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                contractVersionOutdated:
                  summary: Версия договора устарела
                  value:
                    type: https://api.bank.example/problems/contract-version-outdated
                    title: Версия договора устарела
                    status: 409
                    code: CONTRACT_VERSION_OUTDATED
                    traceId: 0af7651916cd43dd8448eb211c80319c
                invalidState:
                  summary: Заявка не в статусе CONTRACT_PENDING
                  value:
                    type: https://api.bank.example/problems/invalid-application-state
                    title: Недопустимое действие для текущего статуса заявки
                    status: 409
                    code: INVALID_APPLICATION_STATE
                    traceId: 0af7651916cd43dd8448eb211c80319c
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /wallet-applications/{applicationId}/certificate-requests:
    post:
      operationId: submitCertificateRequest
      summary: Передать запрос на сертификат ключа проверки ЭП
      description: |
        Принимает запрос на сертификат ключа проверки ЭП (CSR), созданный на устройстве клиента
        (шаг 10 сценария, AC-13). Закрытый ключ в API не передаётся.

        **Предусловие:** заявка в статусе `KEYS_PENDING`; иначе `409 INVALID_APPLICATION_STATE`.

        **Что делает сервер синхронно, до ответа `202`:**
        1. для кошелька ИП получает сведения об ИП из АБС (`CORE_BANKING`);
        2. проверяет заявку в антифроде (`ANTIFRAUD`, таймаут 500 мс; при таймауте или недоступности
           результат считается `REVIEW`);
        3. при `ALLOW` передаёт на платформу ЦР (`DR_PLATFORM`) запрос на выпуск сертификата
           и открытие счёта (с подтверждением приёма).

        Ответ `202` содержит заявку в статусе по результату антифрода (AC-13, AC-14):
        `PROCESSING` — `ALLOW`, запрос передан на платформу; `ON_REVIEW` — `REVIEW`;
        `REJECTED` с `rejectReason: OPERATION_DECLINED_BY_SECURITY` — `DENY`, без деталей проверки.

        **Асинхронно:** результат платформы — `COMPLETED` с `walletId` или `REJECTED`
        (`CERTIFICATE_ISSUE_FAILED` / `WALLET_OPENING_REFUSED`) (AC-15); из `ON_REVIEW` после
        ручной проверки — `PROCESSING` или `REJECTED`. Клиент узнаёт итог опросом
        `getWalletApplication` с интервалом 2 с.

        После передачи CSR отменить заявку нельзя.

        **Недоступность внешней системы:** `503 PLATFORM_UNAVAILABLE` / `CORE_BANKING_UNAVAILABLE`
        или `504 UPSTREAM_TIMEOUT`, заявка остаётся в `KEYS_PENDING`; запрос можно повторить
        с тем же `Idempotency-Key` (AC-17).
      tags: [Wallet Opening]
      x-jira-key: SCRUM-2194
      x-acceptance-criteria: [AC-13, AC-14, AC-15, AC-17, AC-18]
      x-business-rules: [BR-GEN-01, BR-GEN-02, BR-DR-OPEN-10, BR-DR-OPEN-15, BR-AF-01, BR-AF-02, BR-AF-03, BR-AML-01, BR-IDM-01, BR-IDM-02, BR-TIME-03]
      x-external-systems: [CORE_BANKING, DR_PLATFORM, ANTIFRAUD]
      x-assumption: Сведения из АБС, проверка антифрода и передача запроса на платформу выполняются синхронно до ответа 202 (Task — антифрод синхронно, платформа на шаге 10 асинхронно; integrations.md — последовательность АФ → платформа → 202; E1 и AC-17 — ошибка недоступности возвращается клиенту). Результат платформы — асинхронно.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitCertificateRequestRequest'
            examples:
              gost256:
                summary: CSR для ключа ГОСТ Р 34.10-2012 (256 бит)
                value:
                  csr: TUlJQkVqQ0J3QUlCQURBV01SUXdFZ1lEVlFRRERBdFVSVk5VTFVOVFVpMHdNUT09
                  keyAlgorithm: GOST_R_34_10_2012_256
      responses:
        '202':
          description: |
            Запрос принят. Заявка в статусе `PROCESSING` (антифрод `ALLOW`), `ON_REVIEW` (`REVIEW`)
            или `REJECTED` с `rejectReason: OPERATION_DECLINED_BY_SECURITY` (`DENY`).
          headers:
            Location:
              $ref: '#/components/headers/Location'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletApplication'
              examples:
                processing:
                  summary: Заявка в обработке
                  value:
                    id: 3f6c1e2a-7b4d-4c1e-9a2b-1d2e3f4a5b6c
                    ownerType: INDIVIDUAL
                    status: PROCESSING
                    acceptedContractVersion: '2026.09.01'
                    contractAcceptedAt: '2026-11-19T14:25:10+03:00'
                    expiresAt: '2026-11-20T14:21:00+03:00'
                    createdAt: '2026-11-19T14:21:00+03:00'
                    updatedAt: '2026-11-19T14:26:02+03:00'
                onReview:
                  summary: Антифрод требует дополнительной проверки
                  value:
                    id: 3f6c1e2a-7b4d-4c1e-9a2b-1d2e3f4a5b6c
                    ownerType: INDIVIDUAL
                    status: ON_REVIEW
                    acceptedContractVersion: '2026.09.01'
                    contractAcceptedAt: '2026-11-19T14:25:10+03:00'
                    expiresAt: '2026-11-20T14:21:00+03:00'
                    createdAt: '2026-11-19T14:21:00+03:00'
                    updatedAt: '2026-11-19T14:26:02+03:00'
                rejectedSecurity:
                  summary: Отказ по результатам проверки безопасности
                  value:
                    id: 3f6c1e2a-7b4d-4c1e-9a2b-1d2e3f4a5b6c
                    ownerType: INDIVIDUAL
                    status: REJECTED
                    rejectReason: OPERATION_DECLINED_BY_SECURITY
                    acceptedContractVersion: '2026.09.01'
                    contractAcceptedAt: '2026-11-19T14:25:10+03:00'
                    expiresAt: '2026-11-20T14:21:00+03:00'
                    createdAt: '2026-11-19T14:21:00+03:00'
                    updatedAt: '2026-11-19T14:26:02+03:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidApplicationState'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /wallet-applications/{applicationId}/cancel:
    post:
      operationId: cancelWalletApplication
      summary: Отменить заявку на открытие кошелька
      description: |
        Отменяет заявку по решению клиента, в том числе при отказе от договора (A6, AC-12).

        **Предусловие:** заявка в статусе `CREATED`, `ESIA_PENDING`, `CONTRACT_PENDING` или
        `KEYS_PENDING` (до передачи запроса на сертификат); иначе `409 INVALID_APPLICATION_STATE`.

        **Результат:** заявка в финальном статусе `CANCELLED`. Внешние системы не вызываются.

        **Идемпотентность:** повтор с тем же `Idempotency-Key` после успешной отмены возвращает тот же `200`
        с `CANCELLED`, а не `409 INVALID_APPLICATION_STATE`. Тот же ключ с другим телом — `422 IDEMPOTENCY_KEY_REUSED`.
      tags: [Wallet Opening]
      x-jira-key: SCRUM-2194
      x-acceptance-criteria: [AC-12, AC-18]
      x-business-rules: [BR-GEN-01, BR-GEN-02, BR-IDM-01, BR-IDM-02]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Заявка отменена.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletApplication'
              examples:
                cancelled:
                  summary: Заявка отменена
                  value:
                    id: 3f6c1e2a-7b4d-4c1e-9a2b-1d2e3f4a5b6c
                    ownerType: INDIVIDUAL
                    status: CANCELLED
                    expiresAt: '2026-11-20T14:21:00+03:00'
                    createdAt: '2026-11-19T14:21:00+03:00'
                    updatedAt: '2026-11-19T14:24:00+03:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidApplicationState'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /wallets/{walletId}:
    get:
      operationId: getWallet
      summary: Получить данные кошелька
      description: |
        Возвращает данные открытого кошелька для экрана кошелька (шаг 13 сценария, AC-16):
        тип, статус, маскированный номер, баланс и дату открытия. Идентификатор кошелька —
        из поля `walletId` заявки в статусе `COMPLETED`.

        **Что делает сервер:** синхронно получает статус и баланс на платформе ЦР (`DR_PLATFORM`).
        Сразу после открытия кошелёк в статусе `ACTIVE` с балансом 0,00 ₽.

        Ответ содержит банковскую тайну и не кэшируется (`Cache-Control: no-store`).
        Кошелёк другого клиента или несуществующий — `404`.

        **Недоступность платформы:** `503 PLATFORM_UNAVAILABLE` / `504 UPSTREAM_TIMEOUT` (AC-17).
      tags: [Wallet Opening]
      x-jira-key: SCRUM-2194
      x-acceptance-criteria: [AC-16, AC-17]
      x-business-rules: [BR-GEN-01, BR-GEN-02, BR-TIME-03]
      x-external-systems: [DR_PLATFORM]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: walletId
          in: path
          required: true
          description: Идентификатор кошелька (из `walletId` заявки).
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Данные кошелька.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
              examples:
                newWallet:
                  summary: Только что открытый личный кошелёк
                  value:
                    id: 6a7b8c9d-0e1f-4a2b-9c3d-4e5f6a7b8c9d
                    ownerType: INDIVIDUAL
                    status: ACTIVE
                    walletNumberMasked: '**** 7788'
                    balance:
                      value: '0.00'
                      currency: RUB
                    openedAt: '2026-11-19T14:27:40+03:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Сквозной идентификатор запроса для трассировки.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Ключ идемпотентности; повтор с тем же ключом в течение 24 часов возвращает исходный результат.
      schema:
        type: string
        format: uuid
    ApplicationId:
      name: applicationId
      in: path
      required: true
      description: Идентификатор заявки на открытие кошелька.
      schema:
        type: string
        format: uuid
  headers:
    CacheControlNoStore:
      description: Ответ содержит конфиденциальные данные и не кэшируется.
      schema:
        type: string
        enum: [no-store]
    Location:
      description: URL созданного ресурса или ресурса статуса.
      schema:
        type: string
        format: uri
    RetryAfter:
      description: Через сколько секунд можно повторить запрос.
      schema:
        type: integer
        minimum: 1
    XRequestId:
      description: Сквозной идентификатор запроса (переданный клиентом или сгенерированный сервером).
      schema:
        type: string
        format: uuid
  schemas:
    OwnerType:
      type: string
      description: |
        Тип кошелька (владельца счёта цифрового рубля):
        - `INDIVIDUAL` — личный кошелёк физического лица;
        - `SOLE_PROPRIETOR` — кошелёк ИП для предпринимательской деятельности.
      enum: [INDIVIDUAL, SOLE_PROPRIETOR]
      x-business-rules: [BR-DR-OPEN-04, BR-DR-OPEN-05]
    WalletApplicationStatus:
      type: string
      description: |
        Статус заявки (business-rules §8.1):
        `CREATED` — создана; `ESIA_PENDING` — ожидаются данные из Госуслуг;
        `CONTRACT_PENDING` — ожидается принятие договора; `KEYS_PENDING` — ожидается CSR;
        `PROCESSING` — регистрация на платформе и проверки; `ON_REVIEW` — дополнительная проверка;
        `COMPLETED` — кошелёк открыт; `REJECTED` — отказ (причина в `rejectReason`);
        `CANCELLED` — отменена клиентом; `EXPIRED` — истёк срок; `FAILED` — техническая ошибка.
      enum:
        - CREATED
        - ESIA_PENDING
        - CONTRACT_PENDING
        - KEYS_PENDING
        - PROCESSING
        - ON_REVIEW
        - COMPLETED
        - REJECTED
        - CANCELLED
        - EXPIRED
        - FAILED
    CreateWalletApplicationRequest:
      type: object
      description: Запрос на создание заявки на открытие кошелька. Клиент определяется по токену (BR-GEN-01).
      additionalProperties: false
      required: [ownerType]
      properties:
        ownerType:
          $ref: '#/components/schemas/OwnerType'
    WalletApplication:
      type: object
      description: Заявка на открытие кошелька цифрового рубля.
      required: [id, ownerType, status, expiresAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Идентификатор заявки.
        ownerType:
          $ref: '#/components/schemas/OwnerType'
        status:
          $ref: '#/components/schemas/WalletApplicationStatus'
        rejectReason:
          type: string
          readOnly: true
          description: |
            Причина отказа; есть только в статусе `REJECTED`:
            - `ESIA_CONSENT_DENIED` — клиент отказал в согласии на передачу данных из Госуслуг (AC-07);
            - `ESIA_ACCOUNT_NOT_CONFIRMED` — учётная запись на Госуслугах не подтверждена (AC-07);
            - `WALLET_ALREADY_EXISTS` — счёт этого типа уже открыт на платформе через другой банк (AC-08);
            - `OPERATION_DECLINED_BY_SECURITY` — отказ по результатам проверки безопасности, без деталей (AC-14, BR-AF-03);
            - `CERTIFICATE_ISSUE_FAILED` — платформа отказала в выпуске сертификата (A9);
            - `WALLET_OPENING_REFUSED` — отказ в открытии счёта (A9, BR-DR-OPEN-14, BR-AML-01).
          enum:
            - ESIA_CONSENT_DENIED
            - ESIA_ACCOUNT_NOT_CONFIRMED
            - WALLET_ALREADY_EXISTS
            - OPERATION_DECLINED_BY_SECURITY
            - CERTIFICATE_ISSUE_FAILED
            - WALLET_OPENING_REFUSED
        walletId:
          type: string
          format: uuid
          readOnly: true
          description: Идентификатор открытого кошелька; есть только в статусе `COMPLETED` (AC-15).
        acceptedContractVersion:
          type: string
          readOnly: true
          maxLength: 32
          description: Версия договора, принятая клиентом (AC-10).
        contractAcceptedAt:
          type: string
          format: date-time
          readOnly: true
          description: Время принятия договора клиентом (AC-10).
        expiresAt:
          type: string
          format: date-time
          readOnly: true
          description: Срок действия заявки (24 часа с момента создания); после него незавершённая заявка переходит в `EXPIRED` (AC-19).
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Время создания заявки.
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: Время последнего изменения заявки.
    EsiaAuthorization:
      type: object
      description: Ссылка для перехода клиента в Госуслуги. Данные и токены ЕСИА не возвращаются (SD-API-16).
      required: [applicationId, status, authorizationUrl]
      properties:
        applicationId:
          type: string
          format: uuid
          readOnly: true
          description: Идентификатор заявки.
        status:
          $ref: '#/components/schemas/WalletApplicationStatus'
        authorizationUrl:
          type: string
          format: uri
          readOnly: true
          description: Ссылка для перехода клиента на страницу авторизации и согласия в Госуслугах.
    WalletContract:
      type: object
      description: Актуальная версия договора счёта цифрового рубля и сопутствующие документы платформы (публичные данные).
      required: [contractId, contractVersion, documentUrl, platformRulesUrl, tariffsUrl]
      properties:
        contractId:
          type: string
          format: uuid
          readOnly: true
          description: Идентификатор договора; передаётся при принятии договора.
        contractVersion:
          type: string
          readOnly: true
          maxLength: 32
          description: Версия договора; передаётся при принятии договора.
        documentUrl:
          type: string
          format: uri
          readOnly: true
          description: Ссылка на текст договора счёта цифрового рубля.
        platformRulesUrl:
          type: string
          format: uri
          readOnly: true
          description: Ссылка на правила платформы цифрового рубля.
        tariffsUrl:
          type: string
          format: uri
          readOnly: true
          description: Ссылка на тарифы платформы цифрового рубля.
    AcceptWalletContractRequest:
      type: object
      description: Согласие клиента с договором счёта цифрового рубля, правилами платформы и тарифами.
      additionalProperties: false
      required: [contractId, contractVersion, accepted]
      properties:
        contractId:
          type: string
          format: uuid
          description: Идентификатор договора, с которым ознакомился клиент.
        contractVersion:
          type: string
          minLength: 1
          maxLength: 32
          description: Версия договора, с которой ознакомился клиент; должна совпадать с актуальной.
        accepted:
          type: boolean
          enum: [true]
          description: Явное согласие клиента на открытие счёта (BR-DR-OPEN-07). Допустимо только `true`.
    SubmitCertificateRequestRequest:
      type: object
      description: Запрос на сертификат ключа проверки ЭП. Закрытый ключ остаётся на устройстве и не передаётся (BR-DR-OPEN-10).
      additionalProperties: false
      required: [csr, keyAlgorithm]
      properties:
        csr:
          type: string
          format: byte
          writeOnly: true
          maxLength: 8192
          description: Запрос на сертификат (PKCS#10, DER) в base64, сформированный на устройстве клиента.
          x-sensitivity:
            level: C1
          x-assumption: Формат CSR (PKCS#10 DER в base64) и предельная длина не заданы в требованиях.
        keyAlgorithm:
          type: string
          description: Алгоритм ключа ЭП.
          enum: [GOST_R_34_10_2012_256, GOST_R_34_10_2012_512]
          x-assumption: Перечень алгоритмов не задан в требованиях; приняты алгоритмы ГОСТ Р 34.10-2012.
    Wallet:
      type: object
      description: Кошелёк (счёт цифрового рубля) клиента.
      required: [id, ownerType, status, walletNumberMasked, balance, openedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Идентификатор кошелька.
        ownerType:
          $ref: '#/components/schemas/OwnerType'
        status:
          type: string
          readOnly: true
          description: |
            Статус кошелька (business-rules §8.2): `ACTIVE` — действует; `BLOCKED_BY_CLIENT` —
            заблокирован клиентом; `RESTRICTED` — действуют ограничения; `CLOSING` — закрывается;
            `CLOSED` — закрыт. Сразу после открытия — `ACTIVE`.
          enum: [ACTIVE, BLOCKED_BY_CLIENT, RESTRICTED, CLOSING, CLOSED]
        walletNumberMasked:
          type: string
          readOnly: true
          pattern: '^\*{4} [0-9A-Za-z]{4}$'
          description: Номер счёта цифрового рубля, маскированный (видны последние 4 символа).
          x-sensitivity:
            level: C2
            category: BANK_SECRECY
            masking: MASK-WALLET
          x-assumption: Формат номера счёта цифрового рубля не подтверждён (sensitive-data §11, вопрос 1).
        balance:
          allOf:
            - $ref: '#/components/schemas/Money'
          readOnly: true
          description: Баланс кошелька по данным платформы ЦР.
          x-sensitivity:
            level: C2
            category: BANK_SECRECY
            masking: MASK-NONE
            log: MASK-HIDE
        openedAt:
          type: string
          format: date-time
          readOnly: true
          description: Дата и время открытия кошелька.
    Money:
      type: object
      description: Денежная сумма.
      required: [value, currency]
      properties:
        value:
          type: string
          pattern: '^\d{1,15}(\.\d{1,2})?$'
          description: Сумма в рублях с точностью до копеек.
        currency:
          type: string
          enum: [RUB]
          description: Код валюты по ISO 4217.
    Problem:
      type: object
      description: Описание ошибки по RFC 9457.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: URI типа ошибки.
        title:
          type: string
          description: Краткое описание типа ошибки.
        status:
          type: integer
          description: HTTP-код ответа.
        detail:
          type: string
          description: Пояснение без ПДн и без сведений о мерах ПОД/ФТ.
        instance:
          type: string
          description: Идентификатор конкретного случая ошибки.
        code:
          type: string
          description: Бизнес-код ошибки из каталога (business-rules §9).
        traceId:
          type: string
          description: Идентификатор для поиска в журналах.
        errors:
          type: array
          description: Ошибки валидации полей (только для 400).
          items:
            type: object
            required: [field, code]
            properties:
              field:
                type: string
                description: Путь к полю в запросе.
              code:
                type: string
                description: Код ошибки валидации.
              message:
                type: string
                description: Пояснение.
    ClientNotEligibleProblem:
      description: Ошибка `CLIENT_NOT_ELIGIBLE` с причиной несоответствия требованиям (AC-01b, AC-02).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [reason]
          properties:
            reason:
              type: string
              description: |
                Причина: `AGE` — клиент младше 18 лет; `CITIZENSHIP` — клиент не гражданин РФ;
                `NOT_SOLE_PROPRIETOR` — запрошен кошелёк ИП, но клиент не зарегистрирован в банке как ИП.
              enum: [AGE, CITIZENSHIP, NOT_SOLE_PROPRIETOR]
    WalletAlreadyExistsProblem:
      description: Ошибка `WALLET_ALREADY_EXISTS` с типом уже открытого кошелька (AC-03).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [ownerType]
          properties:
            ownerType:
              $ref: '#/components/schemas/OwnerType'
    ApplicationInProgressProblem:
      description: Ошибка `APPLICATION_IN_PROGRESS` с идентификатором незавершённой заявки (AC-04).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [applicationId]
          properties:
            applicationId:
              type: string
              format: uuid
              description: Идентификатор существующей незавершённой заявки того же типа.
  responses:
    BadRequest:
      description: Некорректный запрос (`VALIDATION_ERROR`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validationError:
              summary: Ошибка валидации
              value:
                type: https://api.bank.example/problems/validation-error
                title: Некорректный запрос
                status: 400
                code: VALIDATION_ERROR
                traceId: 0af7651916cd43dd8448eb211c80319c
                errors:
                  - field: ownerType
                    code: INVALID_ENUM_VALUE
                    message: Недопустимое значение
    Unauthorized:
      description: Требуется аутентификация (`UNAUTHORIZED`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unauthorized:
              summary: Токен отсутствует или недействителен
              value:
                type: https://api.bank.example/problems/unauthorized
                title: Требуется аутентификация
                status: 401
                code: UNAUTHORIZED
                traceId: 0af7651916cd43dd8448eb211c80319c
    Forbidden:
      description: |
        Операция недоступна клиенту. Возможные `code`:
        - `IDENTIFICATION_REQUIRED` — недостаточный уровень идентификации в банке (BR-GEN-03);
        - `CLIENT_BLOCKED` — клиент заблокирован в банке (BR-GEN-04).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            identificationRequired:
              summary: Требуется идентификация
              value:
                type: https://api.bank.example/problems/identification-required
                title: Требуется идентификация в банке
                status: 403
                code: IDENTIFICATION_REQUIRED
                traceId: 0af7651916cd43dd8448eb211c80319c
            clientBlocked:
              summary: Клиент заблокирован
              value:
                type: https://api.bank.example/problems/client-blocked
                title: Операция недоступна
                status: 403
                code: CLIENT_BLOCKED
                traceId: 0af7651916cd43dd8448eb211c80319c
    NotFound:
      description: Ресурс не найден или принадлежит другому клиенту (`RESOURCE_NOT_FOUND`, AC-18).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notFound:
              summary: Ресурс не найден
              value:
                type: https://api.bank.example/problems/resource-not-found
                title: Ресурс не найден
                status: 404
                code: RESOURCE_NOT_FOUND
                traceId: 0af7651916cd43dd8448eb211c80319c
    InvalidApplicationState:
      description: |
        Конфликт состояния. Возможные `code`:
        - `INVALID_APPLICATION_STATE` — шаг недопустим для текущего статуса заявки (в том числе для финального статуса, AC-19).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidState:
              summary: Недопустимый шаг для статуса заявки
              value:
                type: https://api.bank.example/problems/invalid-application-state
                title: Недопустимое действие для текущего статуса заявки
                status: 409
                code: INVALID_APPLICATION_STATE
                traceId: 0af7651916cd43dd8448eb211c80319c
    IdempotencyKeyReused:
      description: |
        Нарушено бизнес-правило. Возможные `code`:
        - `IDEMPOTENCY_KEY_REUSED` — повтор с тем же ключом идемпотентности, но с другим телом запроса (BR-IDM-02).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            idempotencyKeyReused:
              summary: Ключ идемпотентности использован с другим телом
              value:
                type: https://api.bank.example/problems/idempotency-key-reused
                title: Ключ идемпотентности уже использован
                status: 422
                code: IDEMPOTENCY_KEY_REUSED
                traceId: 0af7651916cd43dd8448eb211c80319c
    TooManyRequests:
      description: Превышен лимит частоты запросов (`TOO_MANY_REQUESTS`).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            tooManyRequests:
              summary: Слишком много запросов
              value:
                type: https://api.bank.example/problems/too-many-requests
                title: Слишком много запросов
                status: 429
                code: TOO_MANY_REQUESTS
                traceId: 0af7651916cd43dd8448eb211c80319c
    InternalServerError:
      description: Внутренняя ошибка сервера (`INTERNAL_ERROR`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internalError:
              summary: Внутренняя ошибка
              value:
                type: https://api.bank.example/problems/internal-error
                title: Внутренняя ошибка
                status: 500
                code: INTERNAL_ERROR
                traceId: 0af7651916cd43dd8448eb211c80319c
    ServiceUnavailable:
      description: |
        Внешняя система временно недоступна, статус заявки не изменён; повторите запрос позже (AC-17).
        Возможные `code`:
        - `PLATFORM_UNAVAILABLE` — недоступна платформа ЦР или Госуслуги;
        - `CORE_BANKING_UNAVAILABLE` — недоступна АБС.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            platformUnavailable:
              summary: Платформа ЦР недоступна
              value:
                type: https://api.bank.example/problems/platform-unavailable
                title: Сервис временно недоступен
                status: 503
                code: PLATFORM_UNAVAILABLE
                traceId: 0af7651916cd43dd8448eb211c80319c
    GatewayTimeout:
      description: Внешняя система не ответила вовремя (`UPSTREAM_TIMEOUT`); статус заявки не изменён, повторите запрос позже (AC-17).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            upstreamTimeout:
              summary: Таймаут внешней системы
              value:
                type: https://api.bank.example/problems/upstream-timeout
                title: Внешняя система не ответила вовремя
                status: 504
                code: UPSTREAM_TIMEOUT
                traceId: 0af7651916cd43dd8448eb211c80319c
