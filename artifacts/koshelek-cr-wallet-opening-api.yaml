        Шаг 13 сценария SCRUM-2194. **Предусловие:** заявка в статусе `COMPLETED`, `walletId`
        получен из заявки; кошелёк принадлежит клиенту (BR-GEN-02).

        **Что делает сервер (синхронно):** получает статус и баланс кошелька на платформе —
        INT-DRP-04 (таймаут попытки 1,5 с, повтор `RP-EXP`); баланс — данные платформы,
        а не АБС (FR-GEN-05). Возвращает тип кошелька, статус, маскированный номер, баланс
        и дату открытия (AC-16, FR-OPEN-13). Полный номер кошелька не возвращается
        (SD-API-04, SD-API-05).

        **Ошибки:** `404` — чужой или несуществующий кошелёк; `503 PLATFORM_UNAVAILABLE` /
        `504 UPSTREAM_TIMEOUT` — платформа недоступна, повторы исчерпаны (AC-17).
        Критерии приёмки: AC-16, AC-17.
