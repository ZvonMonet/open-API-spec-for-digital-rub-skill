components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Токен доступа (JWT), выпущенный сервером авторизации банка; клиент определяется по токену (BR-GEN-01).
  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Сквозной идентификатор запроса для трассировки (NFR-OBS-01).
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Ключ идемпотентности (UUID, без ПДн). Повтор с тем же ключом в течение 24 часов
        возвращает исходный итоговый ответ и не выполняет действие повторно (BR-IDM-01,
        NFR-AV-04). Повтор с тем же ключом и другим телом — `422 IDEMPOTENCY_KEY_REUSED`
        (BR-IDM-02). Сохраняются только итоговые ответы (2xx, 4xx); ответы 5xx не сохраняются —
        повтор выполняет запрос заново, включая проверку антифрода (BR-IDM-03).
      schema:
        type: string
        format: uuid
    ApplicationId:
      name: applicationId
      in: path
      required: true
      description: Идентификатор заявки на открытие кошелька.
      schema:
        type: string
        format: uuid
    WalletId:
      name: walletId
      in: path
      required: true
      description: Идентификатор кошелька (из заявки в статусе `COMPLETED`).
      schema:
        type: string
        format: uuid
  headers:
    CacheControlNoStore:
      description: Ответ содержит конфиденциальные данные и не кэшируется (SD-API-10).
      schema:
        type: string
        enum: [no-store]
    Location:
      description: URL созданного ресурса или ресурса статуса.
      schema:
        type: string
        format: uri
    RetryAfter:
      description: Через сколько секунд можно повторить запрос.
      schema:
        type: integer
        minimum: 1
    XRequestId:
      description: Идентификатор запроса из `X-Request-Id` или сгенерированный сервером (NFR-OBS-01).
      schema:
        type: string
        format: uuid
  schemas:
    OwnerType:
      type: string
      description: |
        Тип кошелька (владельца счёта цифрового рубля): `INDIVIDUAL` — личный кошелёк
        физического лица; `SOLE_PROPRIETOR` — кошелёк ИП для предпринимательской деятельности
        (BR-DR-OPEN-04, BR-DR-OPEN-05, FR-GEN-04).
      enum: [INDIVIDUAL, SOLE_PROPRIETOR]
    WalletApplicationStatus:
      type: string
      description: |
        Статус заявки (business-rules §8.1): `CREATED` — создана; `ESIA_PENDING` — ожидается
        авторизация в Госуслугах; `CONTRACT_PENDING` — ожидается принятие договора;
        `KEYS_PENDING` — ожидается запрос на сертификат; `PROCESSING` — проверки и открытие
        счёта на платформе; `ON_REVIEW` — дополнительная проверка; `COMPLETED` — кошелёк
        открыт; `REJECTED` — отказ (см. `rejectReason`); `CANCELLED` — отменена клиентом;
        `EXPIRED` — истёк срок; `FAILED` — техническая ошибка без возможности повтора
        (см. `errorCode`, FR-OPEN-10). Финальные:
        `COMPLETED`, `REJECTED`, `CANCELLED`, `EXPIRED`, `FAILED`.
      enum: [CREATED, ESIA_PENDING, CONTRACT_PENDING, KEYS_PENDING, PROCESSING, ON_REVIEW, COMPLETED, REJECTED, CANCELLED, EXPIRED, FAILED]
    CreateWalletApplicationRequest:
      type: object
      additionalProperties: false
      required: [ownerType]
      properties:
        ownerType:
          $ref: '#/components/schemas/OwnerType'
    WalletApplication:
      type: object
      description: Заявка на открытие кошелька цифрового рубля. Данных ЕСИА и деталей проверок не содержит (SD-API-16, BR-AF-03).
      required: [applicationId, ownerType, status, expiresAt, createdAt, updatedAt]
      properties:
        applicationId:
          type: string
          format: uuid
          readOnly: true
          description: Идентификатор заявки.
        ownerType:
          $ref: '#/components/schemas/OwnerType'
        status:
          $ref: '#/components/schemas/WalletApplicationStatus'
        rejectReason:
          type: string
          readOnly: true
          description: |
            Причина отказа; присутствует только в статусе `REJECTED`.
            `ESIA_CONSENT_DENIED`, `ESIA_ACCOUNT_NOT_CONFIRMED` — отказ на стороне Госуслуг (AC-07);
            `WALLET_ALREADY_EXISTS` — счёт выбранного типа уже открыт через другой банк (AC-08);
            `OPERATION_DECLINED_BY_SECURITY` — отказ по результатам проверки, без деталей (AC-14,
            BR-AF-03); `CERTIFICATE_ISSUE_FAILED` — платформа отказала в выпуске сертификата (A9);
            `WALLET_OPENING_REFUSED` — платформа или банк отказали в открытии счёта (A9,
            BR-DR-OPEN-14, BR-AML-01).
          enum: [ESIA_CONSENT_DENIED, ESIA_ACCOUNT_NOT_CONFIRMED, WALLET_ALREADY_EXISTS, OPERATION_DECLINED_BY_SECURITY, CERTIFICATE_ISSUE_FAILED, WALLET_OPENING_REFUSED]
        errorCode:
          type: string
          readOnly: true
          description: |
            Причина технической ошибки; присутствует только в статусе `FAILED` (§8.1, FR-OPEN-10).
            `PLATFORM_UNAVAILABLE` — платформа недоступна: повторные отправки запроса на открытие
            счёта (до 3) исчерпаны или уточнение статуса недоступно; `UPSTREAM_TIMEOUT` — результат
            не получен за время ожидания.
          enum: [PLATFORM_UNAVAILABLE, UPSTREAM_TIMEOUT]
        expiresAt:
          type: string
          format: date-time
          readOnly: true
          description: Срок действия заявки — 24 часа с момента создания; после него заявка переходит в `EXPIRED` (AC-19, NFR-RET-01).
        walletId:
          type: string
          format: uuid
          readOnly: true
          description: Идентификатор открытого кошелька; присутствует только в статусе `COMPLETED` (AC-15).
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Дата и время создания заявки.
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: Дата и время последнего изменения статуса заявки.
    EsiaAuthorization:
      type: object
      description: Результат начала авторизации в Госуслугах. Код авторизации и токены ЕСИА клиенту не возвращаются (sensitive-data §3.3).
      required: [applicationId, status, authorizationUrl]
      properties:
        applicationId:
          type: string
          format: uuid
          description: Идентификатор заявки.
        status:
          $ref: '#/components/schemas/WalletApplicationStatus'
        authorizationUrl:
          type: string
          format: uri
          description: Ссылка для перехода клиента в Госуслуги и согласия на передачу данных (AC-06, INT-ESIA-01).
          x-sensitivity: { level: C1 }
    WalletContract:
      type: object
      description: Актуальная версия договора счёта цифрового рубля, правила платформы и тарифы (AC-09, BR-DR-OPEN-08). Публичные данные (C0).
      required: [contractId, contractVersion, documentUrl, platformRulesUrl, tariffsUrl]
      properties:
        contractId:
          type: string
          maxLength: 64
          description: Идентификатор договора на платформе; формат задаёт платформа (OAS-TYPE-10).
        contractVersion:
          type: string
          maxLength: 32
          description: Версия договора; передаётся при принятии договора.
        documentUrl:
          type: string
          format: uri
          description: Ссылка на текст договора счёта цифрового рубля.
        platformRulesUrl:
          type: string
          format: uri
          description: Ссылка на правила платформы цифрового рубля.
        tariffsUrl:
          type: string
          format: uri
          description: Ссылка на тарифы платформы (тарифы не зашиваются в схему, BR-DR-FEE-03).
    AcceptWalletContractRequest:
      type: object
      additionalProperties: false
      required: [contractVersion, accepted]
      properties:
        contractVersion:
          type: string
          maxLength: 32
          description: Версия договора, с которой ознакомился клиент (из `getWalletApplicationContract`).
        accepted:
          type: boolean
          enum: [true]
          description: Явное согласие клиента с договором, правилами платформы и тарифами (BR-DR-OPEN-07).
    SubmitCertificateRequestRequest:
      type: object
      additionalProperties: false
      required: [csr, keyAlgorithm]
      properties:
        csr:
          type: string
          format: byte
          writeOnly: true
          maxLength: 8192
          description: Запрос на сертификат ключа проверки ЭП — PKCS#10 в кодировке DER, Base64 (OAS-TYPE-11). Содержит только открытый ключ; закрытый ключ не передаётся (BR-DR-OPEN-10).
          x-sensitivity: { level: C1, log: MASK-HASH }
        keyAlgorithm:
          type: string
          description: Алгоритм ключа ЭП, созданного на устройстве — ГОСТ Р 34.10-2012 с ключом 256 или 512 бит, хеш ГОСТ Р 34.11-2012 (OAS-TYPE-12).
          enum: [GOST_R_34_10_2012_256, GOST_R_34_10_2012_512]
    Wallet:
      type: object
      description: Открытый кошелёк цифрового рубля (AC-16, FR-OPEN-13). Содержит банковскую тайну (C2).
      required: [walletId, ownerType, status, walletNumberMasked, balance, openedAt]
      properties:
        walletId:
          type: string
          format: uuid
          readOnly: true
          description: Идентификатор кошелька.
        ownerType:
          $ref: '#/components/schemas/OwnerType'
        status:
          type: string
          readOnly: true
          description: |
            Статус кошелька (business-rules §8.2): `ACTIVE` — действует; `BLOCKED_BY_CLIENT` —
            заблокирован клиентом; `RESTRICTED` — действуют ограничения; `CLOSING` — закрывается;
            `CLOSED` — закрыт. Сразу после открытия — `ACTIVE` (AC-16).
          enum: [ACTIVE, BLOCKED_BY_CLIENT, RESTRICTED, CLOSING, CLOSED]
        walletNumberMasked:
          type: string
          readOnly: true
          pattern: '^0x\*{4}[a-fA-F0-9]{4}$'
          description: Номер счёта цифрового рубля (`0x` + 40 hex, OAS-TYPE-13) в маске `MASK-WALLET` — префикс `0x`, `****` и последние 4 символа.
          x-sensitivity: { level: C2, category: BANK_SECRECY, masking: MASK-WALLET, log: MASK-WALLET }
        balance:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Баланс кошелька по данным платформы (FR-GEN-05); после открытия — 0.00 RUB (AC-16).
          x-sensitivity: { level: C2, category: BANK_SECRECY, masking: MASK-NONE, log: MASK-HIDE }
        openedAt:
          type: string
          format: date-time
          readOnly: true
          description: Дата и время открытия кошелька на платформе.
    Money:
      type: object
      description: Денежная сумма (OAS-TYPE-04).
      required: [value, currency]
      properties:
        value:
          type: string
          pattern: '^\d{1,15}(\.\d{1,2})?$'
          description: Сумма в рублях с точностью до копеек.
        currency:
          type: string
          enum: [RUB]
          description: Код валюты по ISO 4217.
    Problem:
      type: object
      description: Ошибка в формате RFC 9457 (OAS-ERR-02).
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: URI типа ошибки.
        title:
          type: string
          description: Краткое техническое описание типа ошибки; текст для клиента формирует приложение по `code` (NFR-CMP-03).
        status:
          type: integer
          description: HTTP-код ответа.
        detail:
          type: string
          description: Пояснение без ПДн, значений полей запроса и сведений о мерах ПОД/ФТ (SD-API-07).
        instance:
          type: string
          description: Идентификатор конкретного случая ошибки.
        code:
          type: string
          description: Бизнес-код ошибки из каталога business-rules §9.
        traceId:
          type: string
          description: Идентификатор для поиска в журналах (NFR-OBS-02).
        errors:
          type: array
          description: Ошибки валидации полей (только для 400).
          items:
            type: object
            required: [field, code]
            properties:
              field:
                type: string
                description: Путь к полю в запросе.
              code:
                type: string
                description: Код ошибки валидации.
              message:
                type: string
                description: Пояснение.
    WalletApplicationProblem:
      description: Ошибка создания заявки с дополнительными полями, которых требуют AC-01b, AC-03, AC-04.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            ownerType:
              allOf:
                - $ref: '#/components/schemas/OwnerType'
              description: Тип уже открытого кошелька; только при `WALLET_ALREADY_EXISTS` (AC-03).
            applicationId:
              type: string
              format: uuid
              description: Идентификатор существующей незавершённой заявки; только при `APPLICATION_IN_PROGRESS` (AC-04).
            reason:
              type: string
              description: |
                Причина несоответствия требованиям; только при `CLIENT_NOT_ELIGIBLE`:
                `AGE` — младше 18 лет, `CITIZENSHIP` — не гражданин РФ (AC-02, BR-DR-OPEN-01),
                `NOT_SOLE_PROPRIETOR` — не зарегистрирован в банке как ИП (AC-01b, BR-DR-OPEN-15).
              enum: [AGE, CITIZENSHIP, NOT_SOLE_PROPRIETOR]
  examples:
    IdempotencyKeyReused:
      summary: Ключ идемпотентности использован с другим телом (BR-IDM-02)
      value:
        type: https://api.bank.example/problems/idempotency-key-reused
        title: Idempotency key reused
        status: 422
        code: IDEMPOTENCY_KEY_REUSED
        traceId: 0af7651916cd43dd8448eb211c8031b0
    InvalidApplicationState:
      summary: Шаг вызван не в своём статусе заявки (§8.1)
      value:
        type: https://api.bank.example/problems/invalid-application-state
        title: Invalid application state
        status: 409
        code: INVALID_APPLICATION_STATE
        traceId: 0af7651916cd43dd8448eb211c8031b1
  responses:
    BadRequest:
      description: Некорректный запрос — `VALIDATION_ERROR`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.bank.example/problems/validation-error
            title: Validation error
            status: 400
            code: VALIDATION_ERROR
            traceId: 0af7651916cd43dd8448eb211c8031b2
            errors:
              - field: ownerType
                code: INVALID_VALUE
                message: Недопустимое значение.
    Unauthorized:
      description: Требуется аутентификация — `UNAUTHORIZED` (BR-GEN-01).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.bank.example/problems/unauthorized
            title: Unauthorized
            status: 401
            code: UNAUTHORIZED
            traceId: 0af7651916cd43dd8448eb211c8031b3
    NotFound:
      description: Ресурс не найден или принадлежит другому клиенту — `RESOURCE_NOT_FOUND` (AC-18, BR-GEN-02, OAS-ERR-07).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.bank.example/problems/resource-not-found
            title: Resource not found
            status: 404
            code: RESOURCE_NOT_FOUND
            traceId: 0af7651916cd43dd8448eb211c8031b4
    InvalidApplicationState:
      description: Шаг недопустим для текущего статуса заявки (в т. ч. `EXPIRED`) — `INVALID_APPLICATION_STATE` (§8.1, AC-19).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidApplicationState:
              $ref: '#/components/examples/InvalidApplicationState'
    IdempotencyKeyReused:
      description: Ключ идемпотентности уже использован с другим телом запроса — `IDEMPOTENCY_KEY_REUSED` (BR-IDM-02).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            idempotencyKeyReused:
              $ref: '#/components/examples/IdempotencyKeyReused'
    TooManyRequests:
      description: Превышен лимит частоты запросов — `TOO_MANY_REQUESTS` (NFR-RATE-01, NFR-RATE-03).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.bank.example/problems/too-many-requests
            title: Too many requests
            status: 429
            code: TOO_MANY_REQUESTS
            traceId: 0af7651916cd43dd8448eb211c8031b5
    InternalServerError:
      description: Внутренняя ошибка сервера — `INTERNAL_ERROR`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.bank.example/problems/internal-error
            title: Internal error
            status: 500
            code: INTERNAL_ERROR
            traceId: 0af7651916cd43dd8448eb211c8031b6
    PlatformUnavailable:
      description: |
        Платформа цифрового рубля недоступна, повторы `RP-EXP` исчерпаны — `PLATFORM_UNAVAILABLE`.
        Статус заявки не меняется; повторить позже (AC-17, E1).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.bank.example/problems/platform-unavailable
            title: Platform unavailable
            status: 503
            code: PLATFORM_UNAVAILABLE
            traceId: 0af7651916cd43dd8448eb211c8031b7
    GatewayTimeout:
      description: |
        Внешняя система не ответила за отведённое время, повторы исчерпаны — `UPSTREAM_TIMEOUT`.
        Статус ресурса не меняется; запрос можно повторить с тем же `Idempotency-Key` (E1, BR-IDM-03).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.bank.example/problems/upstream-timeout
            title: Upstream timeout
            status: 504
            code: UPSTREAM_TIMEOUT
            traceId: 0af7651916cd43dd8448eb211c8031b8
