openapi: 3.0.3
info:
  title: КошелёкЦР — открытие кошелька цифрового рубля
  version: 1.1.0
  description: |
    Клиентский API модуля КошелёкЦР для открытия кошелька (счёта) цифрового рубля
    на платформе Банка России из мобильного приложения банка.

    **Потребитель:** мобильное приложение банка (через API Gateway банка, NFR-SEC-01).
    **Провайдер:** модуль КошелёкЦР.

    **Объём (SCRUM-2194, SCRUM-2196):** открытие личного кошелька физического лица
    (`ownerType = INDIVIDUAL`) и кошелька ИП для предпринимательской деятельности
    (`ownerType = SOLE_PROPRIETOR`); получение и принятие договора счёта цифрового рубля;
    передача запроса на сертификат ключа проверки ЭП; отслеживание статуса заявки;
    получение данных открытого кошелька.

    **Не входит:** пополнение, вывод, переводы, закрытие кошелька; API бэк-офиса;
    служебный endpoint обработки результата авторизации ЕСИА на сервере банка.

    **Внешние системы** (вызывает модуль, в клиентском API не описываются как операции):
    АБС (`CORE_BANKING`), Госуслуги / ЕСИА (`ESIA`), платформа цифрового рубля
    Банка России (`DR_PLATFORM`), антифрод банка (`ANTIFRAUD`). Взаимодействие с платформой —
    по требованиям Банка России к участникам платформы: защищённый канал, СКЗИ, ГОСТ
    (NFR-SEC-03, SD-API-14). Вызовы внешних систем повторяются модулем по политике `RP-EXP`
    (экспоненциальная задержка с полным джиттером, 3 попытки; NFR-AV-05); после исчерпания
    повторов клиент получает `503` / `504`, статус заявки не меняется (NFR-AV-02, BR-TIME-03).
    Исключение — асинхронная часть открытия счёта (INT-DRP-03): там техническая ошибка без
    возможности повтора переводит заявку в `FAILED` с `errorCode` (§8.1, FR-OPEN-10).

    **Общее:** синхронные операции — не дольше 2 с (p95, NFR-PERF-01), кроме
    `startEsiaAuthorization` (до 64 с, таймаут клиента 70 с, NFR-PERF-05). Каждый `POST`
    передаётся с обязательным `Idempotency-Key` (BR-IDM-01, NFR-AV-04). Пароль к кошельку
    и закрытый ключ ЭП остаются на устройстве и в API не передаются (BR-DR-OPEN-10, 11).

    **Допущения:** нет (все сняты решениями владельца продукта 25.11.2026, см.
    `koshelek-cr-wallet-opening-api-check.md`, раздел 7).
  x-jira-keys: [SCRUM-2194, SCRUM-2196]
servers:
  - url: https://api.bank.example/koshelek-cr/v1
    description: Пример окружения
security:
  - bearerAuth: []
tags:
  - name: Wallet Opening
    description: Открытие кошелька цифрового рубля
paths:
  /wallet-applications:
    post:
      operationId: createWalletApplication
      summary: Создать заявку на открытие кошелька цифрового рубля
      description: |
        Шаг 2 сценария SCRUM-2194. Клиент определяется по токену (BR-GEN-01).

        **Что делает сервер (синхронно):**
        1. Получает профиль клиента из АБС — INT-ABS-01 (таймаут попытки 1 с, повтор `RP-EXP`):
           уровень идентификации, признак блокировки, дата рождения, гражданство, признак ИП.
           Для `SOLE_PROPRIETOR` сведения об ИП сохраняются в заявке и передаются на платформу
           на шаге 10 без повторного запроса в АБС (FR-OPEN-09).
        2. Проверяет: клиент идентифицирован и не заблокирован (BR-GEN-03, BR-GEN-04);
           совершеннолетний гражданин РФ (BR-DR-OPEN-01); для `SOLE_PROPRIETOR` — клиент
           зарегистрирован в банке как ИП (BR-DR-OPEN-15).
        3. Проверяет, что у клиента нет кошелька выбранного типа, открытого через наш банк
           (BR-DR-OPEN-04, BR-DR-OPEN-05). Кошелёк другого типа открытию не мешает (AC-01a).
        4. Проверяет, что нет незавершённой заявки того же `ownerType` (§8.1).
        5. Создаёт заявку в статусе `CREATED` со сроком действия 24 часа (NFR-RET-01).

        **Ответы бизнес-проверок:**
        - `403` — `IDENTIFICATION_REQUIRED`, `CLIENT_BLOCKED`;
        - `409` — `WALLET_ALREADY_EXISTS` (с типом открытого кошелька, AC-03),
          `APPLICATION_IN_PROGRESS` (с идентификатором существующей заявки, AC-04);
        - `422` — `CLIENT_NOT_ELIGIBLE` (с причиной, AC-01b, AC-02), `IDEMPOTENCY_KEY_REUSED`.

        Повтор с тем же `Idempotency-Key` и тем же телом возвращает ту же заявку, новая
        не создаётся (AC-05, BR-IDM-01). Не более 5 заявок в час на клиента (NFR-RATE-01).
        Критерии приёмки: AC-01, AC-01a, AC-01b, AC-02, AC-03, AC-04, AC-05.
      tags: [Wallet Opening]
      x-jira-key: SCRUM-2194
      x-acceptance-criteria: [AC-01, AC-01a, AC-01b, AC-02, AC-03, AC-04, AC-05]
      x-business-rules: [BR-GEN-01, BR-GEN-03, BR-GEN-04, BR-DR-OPEN-01, BR-DR-OPEN-04, BR-DR-OPEN-05, BR-DR-OPEN-13, BR-DR-OPEN-15, BR-IDM-01, BR-IDM-02, BR-IDM-03, BR-TIME-02]
      x-external-systems: [CORE_BANKING]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWalletApplicationRequest'
            examples:
              individual:
                summary: Личный кошелёк физического лица (AC-01)
                value:
                  ownerType: INDIVIDUAL
              soleProprietor:
                summary: Кошелёк ИП для предпринимательской деятельности (AC-01a)
                value:
                  ownerType: SOLE_PROPRIETOR
      responses:
        '201':
          description: |
            Заявка создана в статусе `CREATED` (AC-01, AC-01a). Повтор с тем же
            `Idempotency-Key` возвращает этот же ответ (AC-05).
          headers:
            Location:
              $ref: '#/components/headers/Location'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletApplication'
              examples:
                individualCreated:
                  summary: Заявка на личный кошелёк создана
                  value:
                    applicationId: 3f6c1e2a-8b4d-4c21-9a7e-1d2f3a4b5c60
                    ownerType: INDIVIDUAL
                    status: CREATED
                    expiresAt: '2026-11-24T10:00:00+03:00'
                    createdAt: '2026-11-23T10:00:00+03:00'
                    updatedAt: '2026-11-23T10:00:00+03:00'
                soleProprietorCreated:
                  summary: Заявка на кошелёк ИП создана
                  value:
                    applicationId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                    ownerType: SOLE_PROPRIETOR
                    status: CREATED
                    expiresAt: '2026-11-24T10:05:00+03:00'
                    createdAt: '2026-11-23T10:05:00+03:00'
                    updatedAt: '2026-11-23T10:05:00+03:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Клиент не может открыть кошелёк по данным банка: `IDENTIFICATION_REQUIRED`
            (BR-GEN-03), `CLIENT_BLOCKED` (BR-GEN-04).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                clientBlocked:
                  value:
                    type: https://api.bank.example/problems/client-blocked
                    title: Client blocked
                    status: 403
                    code: CLIENT_BLOCKED
                    traceId: 0af7651916cd43dd8448eb211c80319c
                identificationRequired:
                  value:
                    type: https://api.bank.example/problems/identification-required
                    title: Identification required
                    status: 403
                    code: IDENTIFICATION_REQUIRED
                    traceId: 0af7651916cd43dd8448eb211c80319d
        '409':
          description: |
            Конфликт с существующими ресурсами клиента:
            - `WALLET_ALREADY_EXISTS` — кошелёк выбранного типа уже открыт через наш банк;
              в `ownerType` — тип открытого кошелька (AC-03, BR-DR-OPEN-04, BR-DR-OPEN-05);
            - `APPLICATION_IN_PROGRESS` — есть незавершённая заявка того же типа;
              в `applicationId` — её идентификатор (AC-04, §8.1).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WalletApplicationProblem'
              examples:
                walletAlreadyExists:
                  summary: Кошелёк этого типа уже открыт (AC-03)
                  value:
                    type: https://api.bank.example/problems/wallet-already-exists
                    title: Wallet already exists
                    status: 409
                    code: WALLET_ALREADY_EXISTS
                    ownerType: INDIVIDUAL
                    traceId: 0af7651916cd43dd8448eb211c80319e
                applicationInProgress:
                  summary: Есть незавершённая заявка того же типа (AC-04)
                  value:
                    type: https://api.bank.example/problems/application-in-progress
                    title: Application in progress
                    status: 409
                    code: APPLICATION_IN_PROGRESS
                    applicationId: 3f6c1e2a-8b4d-4c21-9a7e-1d2f3a4b5c60
                    traceId: 0af7651916cd43dd8448eb211c80319f
        '422':
          description: |
            Нарушено бизнес-правило:
            - `CLIENT_NOT_ELIGIBLE` — клиент не соответствует требованиям; в `reason` —
              `AGE`, `CITIZENSHIP` (AC-02, BR-DR-OPEN-01) или `NOT_SOLE_PROPRIETOR`
              (AC-01b, BR-DR-OPEN-15);
            - `IDEMPOTENCY_KEY_REUSED` — ключ уже использован с другим телом (BR-IDM-02).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WalletApplicationProblem'
              examples:
                notSoleProprietor:
                  summary: Запрошен кошелёк ИП, клиент не ИП (AC-01b)
                  value:
                    type: https://api.bank.example/problems/client-not-eligible
                    title: Client not eligible
                    status: 422
                    code: CLIENT_NOT_ELIGIBLE
                    reason: NOT_SOLE_PROPRIETOR
                    traceId: 0af7651916cd43dd8448eb211c8031a0
                underage:
                  summary: Клиент младше 18 лет (AC-02)
                  value:
                    type: https://api.bank.example/problems/client-not-eligible
                    title: Client not eligible
                    status: 422
                    code: CLIENT_NOT_ELIGIBLE
                    reason: AGE
                    traceId: 0af7651916cd43dd8448eb211c8031a1
                idempotencyKeyReused:
                  $ref: '#/components/examples/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: |
            АБС недоступна, повторы `RP-EXP` исчерпаны — `CORE_BANKING_UNAVAILABLE`.
            Заявка не создаётся; запрос можно повторить с тем же `Idempotency-Key` (BR-IDM-03).
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.bank.example/problems/core-banking-unavailable
                title: Core banking unavailable
                status: 503
                code: CORE_BANKING_UNAVAILABLE
                traceId: 0af7651916cd43dd8448eb211c8031a2
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /wallet-applications/{applicationId}:
    get:
      operationId: getWalletApplication
      summary: Получить заявку на открытие кошелька и её статус
      description: |
        Шаг 11 сценария SCRUM-2194: приложение опрашивает статус заявки до `COMPLETED`;
        после открытия в заявке появляется `walletId` (AC-15, FR-OPEN-10).

        **Опрос:** рекомендуемый интервал — 2 с, максимальное время ожидания на клиенте — 60 с,
        после чего приложение показывает «заявка в обработке» (NFR-PERF-03). Не чаще 1 раза
        в секунду на заявку, иначе `429` (NFR-RATE-03).

        **Переходы, которые сервер выполняет без вызова клиента** (статусная модель §8.1):
        - `ESIA_PENDING` → `CONTRACT_PENDING` — данные ЕСИА получены, на платформе нет счёта
          выбранного типа (шаги 4–5, INT-ESIA-02, INT-DRP-01);
        - `ESIA_PENDING` → `REJECTED` — `rejectReason`: `ESIA_CONSENT_DENIED`,
          `ESIA_ACCOUNT_NOT_CONFIRMED` (AC-07) или `WALLET_ALREADY_EXISTS` — счёт открыт через
          другой банк (AC-08);
        - `PROCESSING` → `ON_REVIEW` — антифрод требует дополнительной проверки (AC-14);
        - `ON_REVIEW` → `PROCESSING` / `REJECTED` (`OPERATION_DECLINED_BY_SECURITY`) — решение
          по дополнительной проверке (INT-AF-03);
        - `PROCESSING` → `COMPLETED` — платформа открыла счёт, в заявке `walletId` (AC-15);
        - `PROCESSING` → `REJECTED` — `CERTIFICATE_ISSUE_FAILED`, `WALLET_OPENING_REFUSED`
          (A9, BR-DR-OPEN-14, BR-AML-01) или `OPERATION_DECLINED_BY_SECURITY` (AC-14);
          детали проверок не раскрываются (BR-AF-03);
        - `PROCESSING` → `FAILED` — техническая ошибка без возможности повтора (§8.1, FR-OPEN-10),
          в заявке `errorCode`: `PLATFORM_UNAVAILABLE` — повторные отправки INT-DRP-03 (до 3)
          исчерпаны или уточнение статуса INT-DRP-08 недоступно; `UPSTREAM_TIMEOUT` — результат
          не получен за время ожидания и INT-DRP-08 его не уточнила;
        - `CREATED`, `ESIA_PENDING`, `CONTRACT_PENDING`, `KEYS_PENDING` → `EXPIRED` — заявка не
          завершена за 24 часа; дальнейшие шаги по ней невозможны (AC-19, NFR-RET-01).

        Чужая или несуществующая заявка — `404` (AC-18, BR-GEN-02). Внешние системы не вызываются.
        Критерии приёмки: AC-07, AC-08, AC-14, AC-15, AC-18, AC-19.
      tags: [Wallet Opening]
      x-jira-key: SCRUM-2194
      x-acceptance-criteria: [AC-07, AC-08, AC-14, AC-15, AC-18, AC-19]
      x-business-rules: [BR-GEN-01, BR-GEN-02, BR-AF-02, BR-AF-03, BR-TIME-02, BR-DR-OPEN-14, BR-AML-01]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Заявка с текущим статусом.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletApplication'
              examples:
                processing:
                  summary: Идёт открытие счёта на платформе
                  value:
                    applicationId: 3f6c1e2a-8b4d-4c21-9a7e-1d2f3a4b5c60
                    ownerType: INDIVIDUAL
                    status: PROCESSING
                    expiresAt: '2026-11-24T10:00:00+03:00'
                    createdAt: '2026-11-23T10:00:00+03:00'
                    updatedAt: '2026-11-23T10:12:00+03:00'
                completed:
                  summary: Кошелёк открыт (AC-15)
                  value:
                    applicationId: 3f6c1e2a-8b4d-4c21-9a7e-1d2f3a4b5c60
                    ownerType: INDIVIDUAL
                    status: COMPLETED
                    walletId: 9c8b7a6d-5e4f-4321-8765-0fedcba98765
                    expiresAt: '2026-11-24T10:00:00+03:00'
                    createdAt: '2026-11-23T10:00:00+03:00'
                    updatedAt: '2026-11-23T10:12:20+03:00'
                rejectedEsia:
                  summary: Отказ в согласии на Госуслугах (AC-07)
                  value:
                    applicationId: 3f6c1e2a-8b4d-4c21-9a7e-1d2f3a4b5c60
                    ownerType: INDIVIDUAL
                    status: REJECTED
                    rejectReason: ESIA_CONSENT_DENIED
                    expiresAt: '2026-11-24T10:00:00+03:00'
                    createdAt: '2026-11-23T10:00:00+03:00'
                    updatedAt: '2026-11-23T10:03:00+03:00'
                rejectedOtherBank:
                  summary: Счёт выбранного типа открыт через другой банк (AC-08)
                  value:
                    applicationId: 3f6c1e2a-8b4d-4c21-9a7e-1d2f3a4b5c60
                    ownerType: INDIVIDUAL
                    status: REJECTED
                    rejectReason: WALLET_ALREADY_EXISTS
                    expiresAt: '2026-11-24T10:00:00+03:00'
                    createdAt: '2026-11-23T10:00:00+03:00'
                    updatedAt: '2026-11-23T10:04:00+03:00'
                expired:
                  summary: Срок заявки истёк (AC-19)
                  value:
                    applicationId: 3f6c1e2a-8b4d-4c21-9a7e-1d2f3a4b5c60
                    ownerType: SOLE_PROPRIETOR
                    status: EXPIRED
                    expiresAt: '2026-11-24T10:00:00+03:00'
                    createdAt: '2026-11-23T10:00:00+03:00'
                    updatedAt: '2026-11-24T10:00:00+03:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /wallet-applications/{applicationId}/esia-authorization:
    post:
      operationId: startEsiaAuthorization
      summary: Получить ссылку для авторизации клиента в Госуслугах
      description: |
        Шаг 3 сценария SCRUM-2194. **Предусловие:** заявка в статусе `CREATED` или
        `ESIA_PENDING` (повторный вызов в `ESIA_PENDING` возвращает новую ссылку — так клиент
        заново начинает авторизацию после сбоя на шаге 4 или 5, E2).

        **Что делает сервер (синхронно):** формирует запрос авторизации в ЕСИА — INT-ESIA-01
        (таймаут попытки 20 с, повтор `RP-EXP`), возвращает ссылку для перехода клиента
        в Госуслуги и переводит заявку в `ESIA_PENDING` (AC-06). Результат авторизации ЕСИА
        передаёт на сервер банка (служебный endpoint, вне клиентского API); дальнейшие
        переходы статуса видны в `getWalletApplication`.

        **Время ответа:** до 64 с в худшем случае (3 попытки по 20 с и задержки); таймаут
        API Gateway и клиента — 70 с (NFR-PERF-05).

        **Ошибки:** `409 INVALID_APPLICATION_STATE` — заявка не в `CREATED` / `ESIA_PENDING`
        (в т. ч. `EXPIRED`, AC-19); `422 IDEMPOTENCY_KEY_REUSED`; `503 ESIA_UNAVAILABLE` /
        `504 UPSTREAM_TIMEOUT` — ЕСИА недоступна, повторы исчерпаны, статус не меняется,
        запрос можно повторить с тем же `Idempotency-Key` (AC-17, E1).
        Критерии приёмки: AC-06, AC-17, AC-18, AC-19.
      tags: [Wallet Opening]
      x-jira-key: SCRUM-2194
      x-acceptance-criteria: [AC-06, AC-17, AC-18, AC-19]
      x-business-rules: [BR-GEN-02, BR-DR-OPEN-02, BR-IDM-01, BR-IDM-02, BR-IDM-03, BR-TIME-03]
      x-external-systems: [ESIA]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Ссылка для перехода в Госуслуги; заявка в статусе `ESIA_PENDING` (AC-06).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsiaAuthorization'
              example:
                applicationId: 3f6c1e2a-8b4d-4c21-9a7e-1d2f3a4b5c60
                status: ESIA_PENDING
                authorizationUrl: https://esia.gosuslugi.example/aas/oauth2/ac?state=3f6c1e2a-8b4d-4c21-9a7e-1d2f3a4b5c60
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidApplicationState'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: |
            Госуслуги недоступны, повторы `RP-EXP` исчерпаны — `ESIA_UNAVAILABLE`.
            Статус заявки не меняется; повторить позже с тем же `Idempotency-Key` (AC-17, E1).
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.bank.example/problems/esia-unavailable
                title: ESIA unavailable
                status: 503
                code: ESIA_UNAVAILABLE
                traceId: 0af7651916cd43dd8448eb211c8031a3
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /wallet-applications/{applicationId}/contract:
    get:
      operationId: getWalletApplicationContract
      summary: Получить актуальный договор счёта цифрового рубля
      description: |
        Шаг 6 сценария SCRUM-2194. **Предусловие:** заявка в статусе `CONTRACT_PENDING`.

        **Что делает сервер (синхронно):** запрашивает у платформы актуальную версию договора —
        INT-DRP-02 (таймаут попытки 1,5 с, повтор `RP-EXP`) и возвращает идентификатор и версию
        договора, ссылки на документ, правила платформы и тарифы (AC-09, BR-DR-OPEN-08).
        После отказа `CONTRACT_VERSION_OUTDATED` приложение вызывает операцию заново (A7).

        **Ошибки:** `409 INVALID_APPLICATION_STATE` — заявка не в `CONTRACT_PENDING`
        (в т. ч. `EXPIRED`, AC-19); `503 PLATFORM_UNAVAILABLE` / `504 UPSTREAM_TIMEOUT` —
        платформа недоступна, повторы исчерпаны, статус не меняется (AC-17, E1).
        Критерии приёмки: AC-09, AC-11, AC-17, AC-18, AC-19.
      tags: [Wallet Opening]
      x-jira-key: SCRUM-2194
      x-acceptance-criteria: [AC-09, AC-11, AC-17, AC-18, AC-19]
      x-business-rules: [BR-GEN-02, BR-DR-OPEN-08, BR-DR-OPEN-09, BR-TIME-03]
      x-external-systems: [DR_PLATFORM]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Актуальная версия договора (AC-09).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletContract'
              example:
                contractId: DR-CONTRACT-2026
                contractVersion: '3.1'
                documentUrl: https://docs.platform.example/dr/contract/3.1.pdf
                platformRulesUrl: https://docs.platform.example/dr/rules.pdf
                tariffsUrl: https://docs.platform.example/dr/tariffs.pdf
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidApplicationState'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/PlatformUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /wallet-applications/{applicationId}/contract-acceptance:
    post:
      operationId: acceptWalletApplicationContract
      summary: Принять договор счёта цифрового рубля
      description: |
        Шаг 8 сценария SCRUM-2194. **Предусловие:** заявка в статусе `CONTRACT_PENDING`,
        клиент ознакомился с актуальной версией договора.

        **Что делает сервер (синхронно):** проверяет явное согласие (`accepted: true`,
        BR-DR-OPEN-07) и актуальность `contractVersion`, фиксирует согласие с версией
        и временем принятия (AC-10, BR-DR-OPEN-08) и переводит заявку в `KEYS_PENDING`.
        Актуальная версия запрашивается у платформы в этом же запросе — INT-DRP-02 (таймаут
        попытки 1,5 с, повтор `RP-EXP`); версия, полученная на шаге 6, для сверки не используется:
        новая версия может выйти между шагами 6 и 8 (AC-11, FR-OPEN-06).

        **Ошибки:** `409 CONTRACT_VERSION_OUTDATED` — Банк России опубликовал новую версию,
        согласие не принимается, приложение получает договор заново (AC-11, A7, BR-DR-OPEN-09);
        `409 INVALID_APPLICATION_STATE` — заявка не в `CONTRACT_PENDING` (в т. ч. `EXPIRED`,
        AC-19); `422 IDEMPOTENCY_KEY_REUSED`; `503 PLATFORM_UNAVAILABLE` / `504 UPSTREAM_TIMEOUT` —
        платформа недоступна, повторы исчерпаны, заявка остаётся в `CONTRACT_PENDING` (AC-17, E1).

        **Повтор после таймаута:** если сервер уже выполнил переход, а приложение не получило
        ответ, повтор с тем же `Idempotency-Key` возвращает сохранённый итоговый ответ
        (`200`, заявка в `KEYS_PENDING`), а не `409 INVALID_APPLICATION_STATE` (AC-20, E4,
        BR-IDM-01). Ответы `5xx` по ключу не сохраняются (BR-IDM-03).
        Критерии приёмки: AC-10, AC-11, AC-17, AC-18, AC-19, AC-20.
      tags: [Wallet Opening]
      x-jira-key: SCRUM-2194
      x-acceptance-criteria: [AC-10, AC-11, AC-17, AC-18, AC-19, AC-20]
      x-business-rules: [BR-GEN-02, BR-DR-OPEN-07, BR-DR-OPEN-08, BR-DR-OPEN-09, BR-IDM-01, BR-IDM-02, BR-IDM-03]
      x-external-systems: [DR_PLATFORM]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptWalletContractRequest'
            example:
              contractVersion: '3.1'
              accepted: true
      responses:
        '200':
          description: |
            Согласие зафиксировано, заявка в статусе `KEYS_PENDING` (AC-10). Тот же ответ
            возвращается при повторе с тем же `Idempotency-Key` (AC-20).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletApplication'
              example:
                applicationId: 3f6c1e2a-8b4d-4c21-9a7e-1d2f3a4b5c60
                ownerType: INDIVIDUAL
                status: KEYS_PENDING
                expiresAt: '2026-11-24T10:00:00+03:00'
                createdAt: '2026-11-23T10:00:00+03:00'
                updatedAt: '2026-11-23T10:08:00+03:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            - `CONTRACT_VERSION_OUTDATED` — версия договора устарела (AC-11, BR-DR-OPEN-09);
            - `INVALID_APPLICATION_STATE` — заявка не в `CONTRACT_PENDING` (§8.1, AC-19).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                contractVersionOutdated:
                  summary: Устаревшая версия договора (AC-11)
                  value:
                    type: https://api.bank.example/problems/contract-version-outdated
                    title: Contract version outdated
                    status: 409
                    code: CONTRACT_VERSION_OUTDATED
                    traceId: 0af7651916cd43dd8448eb211c8031a4
                invalidApplicationState:
                  $ref: '#/components/examples/InvalidApplicationState'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/PlatformUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /wallet-applications/{applicationId}/certificate-requests:
    post:
      operationId: submitCertificateRequest
      summary: Передать запрос на сертификат ключа проверки ЭП и открыть счёт
      description: |
        Шаг 10 сценария SCRUM-2194. **Предусловие:** заявка в статусе `KEYS_PENDING`; ключи ЭП
        созданы на устройстве. В запросе передаётся только CSR; закрытый ключ остаётся
        на устройстве и в API отсутствует (AC-13, BR-DR-OPEN-10).

        **Синхронная часть:**
        1. Для `SOLE_PROPRIETOR` используются сведения об ИП, сохранённые в заявке при её создании
           (шаг 2, INT-ABS-01); АБС на этом шаге не вызывается, дополнительных сведений от клиента
           не требуется (BR-DR-OPEN-15, FR-OPEN-09).
        2. Проверка заявки антифродом — INT-AF-01 (таймаут попытки 500 мс, повтор `RP-EXP`,
           BR-AF-01). `REVIEW` → `ON_REVIEW`; `DENY` → `REJECTED` с общей причиной
           `OPERATION_DECLINED_BY_SECURITY`, без деталей проверки (AC-14, BR-AF-02, BR-AF-03).
           Ответ `202` с итоговым `REJECTED` допустим (BR-AF-02, OAS-ASYNC-04).
        3. При `ALLOW` — отправка запроса на выпуск сертификата и открытие счёта на платформу,
           INT-DRP-03 (подтверждение приёма — 1,5 с). Заявка — `PROCESSING`.

        **Ответ:** `202` и заявка в статусе `PROCESSING`, `ON_REVIEW` или `REJECTED`; результат
        открытия — асинхронно, опросом `getWalletApplication` с интервалом 2 с (NFR-PERF-02,
        NFR-PERF-03). Итог: `COMPLETED` с `walletId` (AC-15), `REJECTED`
        (`CERTIFICATE_ISSUE_FAILED`, `WALLET_OPENING_REFUSED`, A9) или `FAILED` с `errorCode`.

        **Асинхронная часть (после `202`):** если приём INT-DRP-03 не подтверждён или результат
        не получен за 30 с, модуль уточняет статус (INT-DRP-08, повтор `RP-EXP`). Платформа
        запрос не получила — повторная отправка с тем же id операции, не более 3 раз
        (NFR-AV-03). Повторные отправки исчерпаны или INT-DRP-08 недоступна → `FAILED`
        (`PLATFORM_UNAVAILABLE`); результат не уточнён за время ожидания → `FAILED`
        (`UPSTREAM_TIMEOUT`); см. `getWalletApplication`.

        **Ошибки (заявка остаётся в `KEYS_PENDING`):**
        - `503 SERVICE_UNAVAILABLE` — проверка безопасности недоступна, повторы исчерпаны
          (AC-21, E3, BR-AF-06); ни ручная проверка, ни отказ не применяются;
        - `503 PLATFORM_UNAVAILABLE` — запрос INT-DRP-03 не удалось доставить на платформу
          (AC-17, E1; `integrations.md`, «Недоставленный и неподтверждённый запрос»).
        Ответы `5xx` по ключу идемпотентности не сохраняются: повтор с тем же `Idempotency-Key`
        выполняет запрос заново, включая проверку антифрода (BR-IDM-03).

        **Прочие ошибки:** `409 INVALID_APPLICATION_STATE` — заявка не в `KEYS_PENDING`
        (в т. ч. `EXPIRED`, AC-19); `422 IDEMPOTENCY_KEY_REUSED`.
        Критерии приёмки: AC-13, AC-14, AC-15, AC-17, AC-18, AC-19, AC-21.
      tags: [Wallet Opening]
      x-jira-key: SCRUM-2194
      x-acceptance-criteria: [AC-13, AC-14, AC-15, AC-17, AC-18, AC-19, AC-21]
      x-business-rules: [BR-GEN-02, BR-DR-OPEN-10, BR-DR-OPEN-14, BR-DR-OPEN-15, BR-AF-01, BR-AF-02, BR-AF-03, BR-AF-06, BR-AML-01, BR-IDM-01, BR-IDM-02, BR-IDM-03, BR-TIME-03]
      x-external-systems: [ANTIFRAUD, DR_PLATFORM]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitCertificateRequestRequest'
            example:
              csr: MIIBTzCB/QIBADBGMQswCQYDVQQGEwJSVTETMBEGA1UEAwwKVGVzdCBVc2Vy
              keyAlgorithm: GOST_R_34_10_2012_256
      responses:
        '202':
          description: |
            Запрос принят к асинхронной обработке (AC-13). Статус заявки — `PROCESSING`;
            при решении антифрода `REVIEW` — `ON_REVIEW`, при `DENY` — `REJECTED`
            с `rejectReason: OPERATION_DECLINED_BY_SECURITY` (AC-14).
          headers:
            Location:
              $ref: '#/components/headers/Location'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletApplication'
              examples:
                processing:
                  summary: Принято, идёт открытие счёта (AC-13)
                  value:
                    applicationId: 3f6c1e2a-8b4d-4c21-9a7e-1d2f3a4b5c60
                    ownerType: INDIVIDUAL
                    status: PROCESSING
                    expiresAt: '2026-11-24T10:00:00+03:00'
                    createdAt: '2026-11-23T10:00:00+03:00'
                    updatedAt: '2026-11-23T10:12:00+03:00'
                onReview:
                  summary: Требуется дополнительная проверка (AC-14)
                  value:
                    applicationId: 3f6c1e2a-8b4d-4c21-9a7e-1d2f3a4b5c60
                    ownerType: INDIVIDUAL
                    status: ON_REVIEW
                    expiresAt: '2026-11-24T10:00:00+03:00'
                    createdAt: '2026-11-23T10:00:00+03:00'
                    updatedAt: '2026-11-23T10:12:00+03:00'
                declined:
                  summary: Отказ по результатам проверки (AC-14)
                  value:
                    applicationId: 3f6c1e2a-8b4d-4c21-9a7e-1d2f3a4b5c60
                    ownerType: INDIVIDUAL
                    status: REJECTED
                    rejectReason: OPERATION_DECLINED_BY_SECURITY
                    expiresAt: '2026-11-24T10:00:00+03:00'
                    createdAt: '2026-11-23T10:00:00+03:00'
                    updatedAt: '2026-11-23T10:12:00+03:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidApplicationState'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: |
            Внешняя система недоступна, повторы исчерпаны; заявка остаётся в `KEYS_PENDING`,
            запрос можно повторить с тем же `Idempotency-Key` (проверки выполняются заново,
            BR-IDM-03):
            - `SERVICE_UNAVAILABLE` — проверка безопасности (AC-21, E3, BR-AF-06);
            - `PLATFORM_UNAVAILABLE` — запрос на открытие счёта не доставлен на платформу
              (AC-17, E1).
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                securityCheckUnavailable:
                  summary: Проверка безопасности недоступна (AC-21)
                  value:
                    type: https://api.bank.example/problems/service-unavailable
                    title: Service unavailable
                    status: 503
                    code: SERVICE_UNAVAILABLE
                    traceId: 0af7651916cd43dd8448eb211c8031a5
                platformUnavailable:
                  summary: Платформа недоступна (AC-17)
                  value:
                    type: https://api.bank.example/problems/platform-unavailable
                    title: Platform unavailable
                    status: 503
                    code: PLATFORM_UNAVAILABLE
                    traceId: 0af7651916cd43dd8448eb211c8031a6

  /wallet-applications/{applicationId}/cancel:
    post:
      operationId: cancelWalletApplication
      summary: Отменить заявку на открытие кошелька
      description: |
        Альтернатива A6 сценария SCRUM-2194: клиент отказывается от открытия (в т. ч. от
        договора на шаге 7). **Предусловие:** заявка в нефинальном статусе до передачи запроса
        на сертификат — `CREATED`, `ESIA_PENDING`, `CONTRACT_PENDING` или `KEYS_PENDING`
        (§8.1, FR-OPEN-11). Заявка переходит в `CANCELLED` (AC-12). Внешние системы
        не вызываются.

        **Ошибки:** `409 INVALID_APPLICATION_STATE` — заявка в другом статусе (в т. ч.
        `EXPIRED`, AC-19); `422 IDEMPOTENCY_KEY_REUSED`.

        **Повтор после таймаута:** повтор с тем же `Idempotency-Key` возвращает сохранённый
        итоговый ответ (`200`, заявка в `CANCELLED`), а не `409 INVALID_APPLICATION_STATE`
        (AC-20, E4, BR-IDM-01). Критерии приёмки: AC-12, AC-18, AC-19, AC-20.
      tags: [Wallet Opening]
      x-jira-key: SCRUM-2194
